name: PR 2B Typing Fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e '.[dev]'
      - name: Apply strict typing corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/csd_foundry/synthesis/v0_4/attempts.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "from typing import TypeAlias",
              "from typing import TYPE_CHECKING, TypeAlias, cast",
          )
          marker = "from csd_foundry.synthesis.v0_4.serialization import canonical_sha256\n"
          if "if TYPE_CHECKING:" not in text:
              text = text.replace(
                  marker,
                  marker
                  + "\nif TYPE_CHECKING:\n"
                  + "    from csd_foundry.synthesis.v0_4.exhaustion import ExhaustionEvidence\n",
              )
          text = text.replace(
              ") -> AcceptedSampleReplay | IncompleteAttemptPrefix | object:",
              ") -> AcceptedSampleReplay | IncompleteAttemptPrefix | ExhaustionEvidence:",
          )
          text = text.replace(
              "            rejected_prefix=tuple(rejected),",
              "            rejected_prefix=cast(tuple[AttemptRejected, ...], rejected),",
          )
          text = text.replace(
              "    rejected_attempts = tuple(ordered)\n"
              "    if not all(type(item) is AttemptRejected for item in rejected_attempts):\n"
              "        raise AttemptReplayError(\"complete exhaustion may contain only rejections\")\n",
              "    if not all(type(item) is AttemptRejected for item in ordered):\n"
              "        raise AttemptReplayError(\"complete exhaustion may contain only rejections\")\n"
              "    rejected_attempts = cast(tuple[AttemptRejected, ...], ordered)\n",
          )
          path.write_text(text, encoding="utf-8")

          path = Path("src/csd_foundry/synthesis/v0_4/choice_records.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "from csd_foundry.synthesis.v0_4.serialization import canonical_json_bytes, canonical_sha256",
              "from csd_foundry.synthesis.v0_4.serialization import (\n"
              "    JSONValue,\n"
              "    canonical_json_bytes,\n"
              "    canonical_sha256,\n"
              ")",
          )
          text = text.replace(
              "    result: WeightedChoiceResult[object],",
              "    result: WeightedChoiceResult[JSONValue],",
          )
          path.write_text(text, encoding="utf-8")

          path = Path("src/csd_foundry/synthesis/v0_4/replay.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "        result = bounded_integer(seed, record.path, record.upper_exclusive)",
              "        bounded_result = bounded_integer(seed, record.path, record.upper_exclusive)",
          ).replace(
              "            result=result,\n        )\n    if type(record) is WeightedChoiceRecord:",
              "            result=bounded_result,\n        )\n    if type(record) is WeightedChoiceRecord:",
              1,
          )
          text = text.replace(
              "        result = weighted_choice(\n",
              "        weighted_result = weighted_choice(\n",
              1,
          ).replace(
              "            result=result,\n        )\n    if type(record) is BooleanRatioChoiceRecord:",
              "            result=weighted_result,\n        )\n    if type(record) is BooleanRatioChoiceRecord:",
              1,
          )
          text = text.replace(
              "        result = choose_ratio(\n",
              "        boolean_result = choose_ratio(\n",
              1,
          ).replace(
              "            result=result,\n        )\n    raise ReplayMismatchError",
              "            result=boolean_result,\n        )\n    raise ReplayMismatchError",
              1,
          )
          path.write_text(text, encoding="utf-8")

          path = Path("src/csd_foundry/synthesis/v0_4/choice_ledger.py")
          text = path.read_text(encoding="utf-8")
          marker = (
              "    @property\n"
              "    def state(self) -> ChoiceSessionState:\n"
              "        return self._state\n"
          )
          if "def attempt_key(self)" not in text:
              text = text.replace(
                  marker,
                  marker
                  + "\n    @property\n"
                  + "    def attempt_key(self) -> AttemptKey:\n"
                  + "        return self._attempt_key\n",
              )
          path.write_text(text, encoding="utf-8")

          path = Path("src/csd_foundry/synthesis/v0_4/replay_validation.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "from dataclasses import dataclass, replace",
              "from dataclasses import dataclass, replace\nfrom typing import cast",
          )
          text = text.replace(
              "    ChoiceSession,\n",
              "    ChoiceLedger,\n    ChoiceSession,\n",
          )
          text = text.replace(
              "    BoundedIntegerChoiceRecord,\n",
              "    BoundedIntegerChoiceRecord,\n    ChoiceRecord,\n",
          )
          text = text.replace(
              "    IdentityLedger,\n",
              "    IdentityLedger,\n    IdentityRecord,\n",
          )
          text = text.replace(
              "    REPLAY_VECTOR_CATALOG,\n",
              "    REPLAY_VECTOR_CATALOG,\n    REPLAY_VECTOR_IDS,\n",
          )
          text = text.replace(
              "def _ledger(attempt: AttemptKey, order: tuple[str, ...] = (\"bounded\", \"weighted\", \"ratio\")):",
              "def _ledger(\n"
              "    attempt: AttemptKey,\n"
              "    order: tuple[str, ...] = (\"bounded\", \"weighted\", \"ratio\"),\n"
              ") -> ChoiceLedger:",
          )
          text = text.replace(
              "def _identity_evidence(attempt: AttemptKey):",
              "def _identity_evidence(\n"
              "    attempt: AttemptKey,\n"
              ") -> tuple[tuple[IdentityRecord, ...], str]:",
          )
          text = text.replace(
              "    if accepted:\n        completion = AttemptAccepted(",
              "    completion: AttemptAccepted | AttemptRejected\n"
              "    if accepted:\n"
              "        completion = AttemptAccepted(",
          )
          text = text.replace(
              "    first_record = accepted.choice_ledger.records[0]\n",
              "    first_record = accepted.choice_ledger.records[0]\n"
              "    tampered_record: ChoiceRecord\n",
          )
          text = text.replace(
              "            rejected_attempts=(rejected_zero,),",
              "            rejected_attempts=(cast(AttemptRejected, rejected_zero),),",
          )
          text = text.replace(
              "_path(session._attempt_key, \"invalid\"),  # type: ignore[attr-defined]",
              "_path(session.attempt_key, \"invalid\"),",
          )
          text = text.replace(
              "        replace(\n"
              "            accepted.completion,\n"
              "            identity_ledger_digest=canonical_sha256({\"tampered\": \"identity\"}),\n"
              "        )\n"
              "        accepted.validate(_seed(), _namespace())",
              "        bad_identity_completion = replace(\n"
              "            accepted.completion,\n"
              "            identity_ledger_digest=canonical_sha256({\"tampered\": \"identity\"}),\n"
              "        )\n"
              "        bad_identity_bundle = AttemptReplayBundle(\n"
              "            accepted.input_commitment,\n"
              "            bad_identity_completion,\n"
              "            accepted.search_branch,\n"
              "            accepted.choice_ledger,\n"
              "            accepted.identity_records,\n"
              "        )\n"
              "        bad_identity_bundle.validate(_seed(), _namespace())",
          )
          text = text.replace(
              "        for vector_id in REPLAY_VECTOR_CATALOG[\"vector_ids\"]:",
              "        for vector_id in REPLAY_VECTOR_IDS:",
          )
          text = text.replace(
              "_path(limited._attempt_key, \"one\"), 2)  # type: ignore[attr-defined]",
              "_path(limited.attempt_key, \"one\"), 2)",
          )
          text = text.replace(
              "_path(limited._attempt_key, \"two\"),  # type: ignore[attr-defined]",
              "_path(limited.attempt_key, \"two\"),",
          )
          path.write_text(text, encoding="utf-8")
          PY
      - run: ruff format src/csd_foundry/synthesis/v0_4
      - run: ruff check --fix src/csd_foundry/synthesis/v0_4
      - name: Commit typing corrections
        run: |
          git config user.name "csd-foundry-ci"
          git config user.email "actions@users.noreply.github.com"
          git add src/csd_foundry/synthesis/v0_4
          git commit -m "Fix strict replay typing"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      - run: mypy src
      - run: pytest
      - name: Print generated replay digests
        run: |
          python - <<'PY'
          import json
          from csd_foundry.synthesis.v0_4.replay_validation import generate_replay_digests
          print(json.dumps(generate_replay_digests(), indent=2, sort_keys=True))
          PY
