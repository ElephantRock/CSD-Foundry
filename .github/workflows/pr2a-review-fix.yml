name: PR2A review fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'web/14-canonical-values-identities-v0.4'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install ruff
      - name: Update subclass rejection expectation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/synthesis_v0_4/test_identities.py')
          text = path.read_text(encoding='utf-8')
          old = 'assert report.invalid_canonical_values_rejected == 8'
          new = 'assert report.invalid_canonical_values_rejected == 10'
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          elif new not in text:
              raise SystemExit('expected assertion anchor not found')
          PY
          ruff format src/csd_foundry/synthesis/v0_4/canonical_values.py src/csd_foundry/synthesis/v0_4/identity_validation.py tests/synthesis_v0_4/test_identities.py
          ruff check --fix src/csd_foundry/synthesis/v0_4/canonical_values.py src/csd_foundry/synthesis/v0_4/identity_validation.py tests/synthesis_v0_4/test_identities.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/csd_foundry/synthesis/v0_4/canonical_values.py src/csd_foundry/synthesis/v0_4/identity_validation.py tests/synthesis_v0_4/test_identities.py
          if ! git diff --cached --quiet; then
            git commit -m "Reject canonical container subclasses"
            git push origin HEAD:${{ github.head_ref }}
          fi
