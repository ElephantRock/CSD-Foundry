name: Integrate v0.4 deterministic source

on:
  pull_request:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Integrate contracts, policies, CLI, and documents
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def replace(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"missing patch anchor in {path}: {old[:80]!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace(
              "src/csd_foundry/synthesis/v0_4/specs.py",
              '    "deterministic_arithmetic_policy.schema.json",\n)',
              '    "deterministic_arithmetic_policy.schema.json",\n'
              '    "choice_algorithm.schema.json",\n)',
          )
          replace(
              "src/csd_foundry/synthesis/v0_4/specs.py",
              '    "root_seed": "csd-foundry-v0.4-release-seed",\n'
              '    "rng_algorithm": "sha256-integer-choice-path",\n'
              '    "rng_version": "0.4.0",\n'
              '    "choice_path_schema_version": "0.4.0",',
              '    "root_seed": "f44e3f73e886fb09389790455b985efd8bcfcc7e096940bcdbab3e0ebacecd1b",\n'
              '    "root_seed_provenance": "uniform-random-256",\n'
              '    "rng_algorithm": "csd-choice-hmac-sha256-rejection",\n'
              '    "rng_version": "1",\n'
              '    "choice_path_schema_version": "csd-choice-path/0.4",',
          )
          choice_spec = '''

          CHOICE_ALGORITHM_SPEC: dict[str, object] = {
              "release": "v0.4",
              "schema_version": "0.4.0",
              "algorithm_id": "csd-choice-hmac-sha256-rejection",
              "algorithm_version": 1,
              "digest_primitive": "hmac-sha256",
              "root_seed_bytes": 32,
              "release_seed_encoding": "lowercase-hex",
              "release_seed_provenance": "uniform-random-256",
              "path_schema_version": "csd-choice-path/0.4",
              "identity_schema_version": "csd-identity/0.4",
              "draw_counter_encoding": "uint64-big-endian",
              "block_counter_encoding": "uint64-big-endian",
              "attempt_index_encoding": "uint32",
              "maximum_attempt_index": 4294967295,
              "candidate_byte_order": "big-endian",
              "display_digest_bits": 128,
              "design_identity_ceiling": 10000000,
              "collision_risk_ceiling_numerator": 15,
              "collision_risk_ceiling_denominator": 100000000000000000000000000,
              "semantic_floating_point_permitted": False,
          }
          '''
          replace(
              "src/csd_foundry/synthesis/v0_4/specs.py",
              '\nSPEC_DOCUMENTS: dict[str, dict[str, object]] = {',
              choice_spec + '\nSPEC_DOCUMENTS: dict[str, dict[str, object]] = {',
          )
          replace(
              "src/csd_foundry/synthesis/v0_4/specs.py",
              '    "deterministic_arithmetic_policy.json": DETERMINISTIC_ARITHMETIC_POLICY_SPEC,\n}',
              '    "deterministic_arithmetic_policy.json": DETERMINISTIC_ARITHMETIC_POLICY_SPEC,\n'
              '    "choice_algorithm.json": CHOICE_ALGORITHM_SPEC,\n}',
          )

          replace(
              "src/csd_foundry/synthesis/v0_4/contracts.py",
              '    root_seed: str\n    rng_algorithm: str',
              '    root_seed: str\n    root_seed_provenance: str\n    rng_algorithm: str',
          )
          replace(
              "src/csd_foundry/synthesis/v0_4/contracts.py",
              '            ("root_seed", self.root_seed),\n            ("rng_algorithm", self.rng_algorithm),',
              '            ("root_seed", self.root_seed),\n'
              '            ("root_seed_provenance", self.root_seed_provenance),\n'
              '            ("rng_algorithm", self.rng_algorithm),',
          )
          replace(
              "src/csd_foundry/synthesis/v0_4/contracts.py",
              '        if self.target_trajectory_count <= 0 or self.pilot_trajectory_count <= 0:',
              '        if _SHA256_PATTERN.fullmatch(self.root_seed) is None:\n'
              '            raise ContractValidationError("root_seed must be a lowercase 256-bit hex seed")\n'
              '        if self.root_seed_provenance != "uniform-random-256":\n'
              '            raise ContractValidationError("release root seed requires uniform-random-256 provenance")\n'
              '        if self.rng_algorithm != "csd-choice-hmac-sha256-rejection":\n'
              '            raise ContractValidationError("release policy must use the normative HMAC choice algorithm")\n'
              '        if self.rng_version != "1":\n'
              '            raise ContractValidationError("release policy rng_version must be 1")\n'
              '        if self.choice_path_schema_version != "csd-choice-path/0.4":\n'
              '            raise ContractValidationError("unsupported choice path schema version")\n'
              '        if self.target_trajectory_count <= 0 or self.pilot_trajectory_count <= 0:',
          )

          replace(
              "src/csd_foundry/synthesis/v0_4/validation.py",
              'from csd_foundry.synthesis.v0_4.contracts import (',
              'from csd_foundry.synthesis.v0_4.choice_policy import load_choice_algorithm_policy\n'
              'from csd_foundry.synthesis.v0_4.contracts import (',
          )
          replace(
              "src/csd_foundry/synthesis/v0_4/validation.py",
              '        root_seed=_string(data, "root_seed"),\n        rng_algorithm=_string(data, "rng_algorithm"),',
              '        root_seed=_string(data, "root_seed"),\n'
              '        root_seed_provenance=_string(data, "root_seed_provenance"),\n'
              '        rng_algorithm=_string(data, "rng_algorithm"),',
          )
          replace(
              "src/csd_foundry/synthesis/v0_4/validation.py",
              '            load_deterministic_arithmetic_policy()\n',
              '            load_deterministic_arithmetic_policy()\n'
              '            load_choice_algorithm_policy()\n',
          )
          replace(
              "src/csd_foundry/synthesis/v0_4/validation.py",
              '        policy_count=4,',
              '        policy_count=5,',
          )

          replace(
              "src/csd_foundry/cli.py",
              '    _add_release_argument(synthesis_contracts, default="v0.4")\n',
              '    _add_release_argument(synthesis_contracts, default="v0.4")\n'
              '    synthesis_determinism = synthesis_sub.add_parser(\n'
              '        "determinism",\n'
              '        help="validate deterministic choice primitives and frozen vectors",\n'
              '    )\n'
              '    _add_release_argument(synthesis_determinism, default="v0.4")\n',
          )
          replace(
              "src/csd_foundry/cli.py",
              '    if args.command == "synthesize" and args.synthesis_command == "contracts":',
              '    if args.command == "synthesize" and args.synthesis_command == "determinism":\n'
              '        from csd_foundry.synthesis.v0_4.determinism_validation import (\n'
              '            validate_determinism,\n'
              '        )\n\n'
              '        determinism_result = validate_determinism(args.release)\n'
              '        _emit(determinism_result.to_dict(), args.output)\n'
              '        if not determinism_result.success:\n'
              '            raise SystemExit(1)\n'
              '        return\n\n'
              '    if args.command == "synthesize" and args.synthesis_command == "contracts":',
          )

          replace(
              "tests/synthesis_v0_4/test_contracts.py",
              '    assert report.schema_document_count == 6',
              '    assert report.schema_document_count == 7\n    assert report.policy_count == 5',
          )
          replace(
              "README.md",
              'csd-foundry synthesize contracts --release v0.4\n',
              'csd-foundry synthesize contracts --release v0.4\n'
              'csd-foundry synthesize determinism --release v0.4\n',
          )
          replace(
              "README.md",
              '1. Implement hash-derived integer choices and deterministic identities.\n'
              '2. Add the performance benchmark harness and freeze reference SLOs.',
              '1. Complete deterministic identities and shard-independent replay on the frozen HMAC choice substrate.\n'
              '2. Add the performance benchmark harness and freeze reference SLOs.',
          )

          docs = '''# CSD Foundry v0.4 Deterministic Choices

          ## Normative algorithm

          Algorithm version 1 is `csd-choice-hmac-sha256-rejection`. It uses only
          HMAC-SHA-256. Plain concatenated SHA-256 is not an alternative implementation.

          The HMAC key is the exact 32-byte root seed. The message is:

          ```text
          b"csd-choice-hmac-sha256-rejection/v1\\x00"
          || uint64_be(len(canonical_material))
          || canonical_material
          || uint64_be(draw_index)
          || uint64_be(block_index)
          ```

          Both counters are local to one choice, zero-based, unsigned 64-bit, and big-endian.
          Canonical material is the existing integer-only canonical JSON representation, including
          its terminal newline.

          ## Rejection and redraw

          For bound `u`, candidate width is the smallest whole-byte width representing `u - 1`,
          with a minimum of one byte. `limit = 256**width - (256**width % u)`. Blocks are
          concatenated in ascending block-index order and truncated to the candidate width. A
          candidate below `limit` returns `candidate % u`.

          A rejected candidate is discarded completely. The next draw increments `draw_index`,
          resets `block_index` to zero, and derives a new candidate. Rejected bytes are never
          reused. Frozen known-answer vectors include two consecutive rejected draws and a 34-byte
          candidate requiring two HMAC blocks.

          ## Attempts and timeouts

          Attempt indices are unsigned 32-bit values. A declared attempt range contains between
          one and 2^32 attempts. The accepted result is the lowest valid attempt index. Speculative
          parallel execution cannot commit a higher successful attempt until every lower attempt
          is resolved; this is a deliberate correctness-over-throughput trade-off.

          Wall-clock expiry is an operational worker failure, not semantic search exhaustion. An
          interrupted sample must be rescheduled from its immutable sample key. Future shard
          sealing must reject missing, unexpected, or conflicting sample completions.

          ## Seeds

          Release mode requires exactly 32 bytes represented as 64 lowercase hexadecimal
          characters and `uniform-random-256` provenance. Text-derived seeds are restricted to
          development and frozen known-answer fixtures and are release-ineligible.

          ## Identity sizing and immutability

          The future display-identity layer is pinned to at least 128 digest bits for a design
          ceiling of ten million identities. The exact birthday-bound upper estimate must remain
          below the exact policy ceiling.

          Once canary, pilot, or release evidence is committed under algorithm version 1, it is
          immutable. Any behavior-affecting change requires a new algorithm version and a
          coexisting artifact namespace; it cannot rewrite version-1 evidence.

          ## Claim boundary

          Passing deterministic validation establishes the algorithm, seed, path, counter, and
          committed known-answer-vector contract. It does not establish entity identity
          allocation, production shard orchestration, planner completeness, state construction,
          or release-scale output.
          '''
          import textwrap
          Path("docs/DETERMINISTIC_CHOICES_V0_4.md").write_text(
              textwrap.dedent(docs), encoding="utf-8"
          )

          from csd_foundry.synthesis.v0_4.choice_vectors import KNOWN_ANSWER_VECTORS
          from csd_foundry.synthesis.v0_4.specs import (
              CHOICE_ALGORITHM_SPEC,
              RELEASE_POLICY_SPEC,
          )

          root = Path("specs/v0.4")
          (root / "choice_algorithm.json").write_text(
              json.dumps(CHOICE_ALGORITHM_SPEC, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          (root / "release_policy.json").write_text(
              json.dumps(RELEASE_POLICY_SPEC, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          choice_schema = {
              "$id": "https://github.com/ElephantRock/CSD-Foundry/specs/v0.4/choice_algorithm.schema.json",
              "$schema": "https://json-schema.org/draft/2020-12/schema",
              "title": "CSD Foundry v0.4 Deterministic Choice Algorithm",
              "type": "object",
              "additionalProperties": False,
              "properties": {
                  "release": {"const": "v0.4"},
                  "schema_version": {"const": "0.4.0"},
                  "algorithm_id": {"const": "csd-choice-hmac-sha256-rejection"},
                  "algorithm_version": {"const": 1},
                  "digest_primitive": {"const": "hmac-sha256"},
                  "root_seed_bytes": {"const": 32},
                  "release_seed_encoding": {"const": "lowercase-hex"},
                  "release_seed_provenance": {"const": "uniform-random-256"},
                  "path_schema_version": {"const": "csd-choice-path/0.4"},
                  "identity_schema_version": {"const": "csd-identity/0.4"},
                  "draw_counter_encoding": {"const": "uint64-big-endian"},
                  "block_counter_encoding": {"const": "uint64-big-endian"},
                  "attempt_index_encoding": {"const": "uint32"},
                  "maximum_attempt_index": {"const": 4294967295},
                  "candidate_byte_order": {"const": "big-endian"},
                  "display_digest_bits": {"minimum": 128, "multipleOf": 8, "type": "integer"},
                  "design_identity_ceiling": {"minimum": 1, "type": "integer"},
                  "collision_risk_ceiling_numerator": {"minimum": 1, "type": "integer"},
                  "collision_risk_ceiling_denominator": {"minimum": 1, "type": "integer"},
                  "semantic_floating_point_permitted": {"const": False},
              },
              "required": list(CHOICE_ALGORITHM_SPEC.keys()),
          }
          (root / "choice_algorithm.schema.json").write_text(
              json.dumps(choice_schema, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          release_schema_path = root / "release_policy.schema.json"
          release_schema = json.loads(release_schema_path.read_text(encoding="utf-8"))
          release_schema["properties"]["root_seed"] = {
              "pattern": "^[0-9a-f]{64}$",
              "type": "string",
          }
          release_schema["properties"]["root_seed_provenance"] = {
              "const": "uniform-random-256"
          }
          release_schema["properties"]["rng_algorithm"] = {
              "const": "csd-choice-hmac-sha256-rejection"
          }
          release_schema["properties"]["rng_version"] = {"const": "1"}
          release_schema["properties"]["choice_path_schema_version"] = {
              "const": "csd-choice-path/0.4"
          }
          release_schema["required"] = list(RELEASE_POLICY_SPEC.keys())
          release_schema_path.write_text(
              json.dumps(release_schema, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          canary = Path("data/canary/v0.4/algorithm-v1")
          canary.mkdir(parents=True, exist_ok=True)
          vector_document = {
              "release": "v0.4",
              "schema_version": "0.4.0",
              "algorithm_id": "csd-choice-hmac-sha256-rejection",
              "algorithm_version": 1,
              "vectors": list(KNOWN_ANSWER_VECTORS),
          }
          (canary / "choice_vectors.json").write_text(
              json.dumps(vector_document, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - run: ruff format .
      - run: ruff check --fix .
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src
      - run: pytest
      - run: python scripts/validate_csd_reasoning_seed.py --directory data/seed/v0.1
      - run: python -m compileall -q src scripts tests
      - run: csd-foundry scenarios validate --release v0.1
      - run: csd-foundry mutations evaluate --release v0.1
      - run: csd-foundry temporal validate --release v0.3
      - run: csd-foundry temporal mutations --release v0.3
      - run: csd-foundry synthesize contracts --release v0.4
      - run: csd-foundry synthesize determinism --release v0.4 --output reports/determinism_v0.4.json
      - run: pip wheel . --no-deps --wheel-dir /tmp/csd-wheelhouse
      - name: Validate installed wheel outside repository
        run: |
          python -m venv /tmp/csd-installed
          /tmp/csd-installed/bin/pip install /tmp/csd-wheelhouse/csd_foundry-*.whl
          cd /tmp
          /tmp/csd-installed/bin/csd-foundry synthesize contracts --release v0.4 > contracts.json
          /tmp/csd-installed/bin/csd-foundry synthesize determinism --release v0.4 > determinism.json
          test -s contracts.json
          test -s determinism.json
      - name: Commit source integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs specs src tests data reports
          git commit -m "Integrate v0.4 deterministic choice primitives"
          git push
