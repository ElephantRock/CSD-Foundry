name: Finalize v0.4 contract integrity

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: web/10-synthesis-contracts-v0.4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Apply class-scoped contract corrections
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path(".github/workflows/patch-v04-contract-integrity.yml").read_text()
          prefix = "          python - <<'PY'\n"
          suffix = "\n          PY\n      - run: ruff format ."
          start = workflow.index(prefix) + len(prefix)
          end = workflow.index(suffix, start)
          exec(textwrap.dedent(workflow[start:end]), {})

          path = Path("src/csd_foundry/kernel/invariants.py")
          text = path.read_text()
          if "from csd_foundry.kernel.invariant_registry import EXECUTABLE_INVARIANT_IDS" not in text:
              import_anchor = (
                  "from csd_foundry.kernel.events import "
                  "CsdEvent, DependencyChange, Reassess, RetireControl\n"
              )
              text = text.replace(
                  import_anchor,
                  import_anchor
                  + "from csd_foundry.kernel.invariant_registry import "
                  "EXECUTABLE_INVARIANT_IDS\n",
                  1,
              )
          class_start = text.index("class Violation:")
          class_end = text.index("\n\ndef _basis_is_supported", class_start)
          violation_block = text[class_start:class_end]
          if "def __post_init__" not in violation_block:
              anchor = "    message: str\n"
              insertion = (
                  "    message: str\n\n"
                  "    def __post_init__(self) -> None:\n"
                  "        if self.invariant_id not in EXECUTABLE_INVARIANT_IDS:\n"
                  "            raise ValueError(\n"
                  "                f\"unregistered executable invariant: {self.invariant_id}\"\n"
                  "            )\n"
              )
              violation_block = violation_block.replace(anchor, insertion, 1)
              text = text[:class_start] + violation_block + text[class_end:]
          path.write_text(text)

          path = Path("src/csd_foundry/synthesis/v0_4/contracts.py")
          text = path.read_text()
          registry_import = (
              "from csd_foundry.kernel.invariant_registry import EXECUTABLE_INVARIANT_IDS"
          )
          if registry_import not in text:
              text = text.replace(
                  "from enum import StrEnum\n",
                  "from enum import StrEnum\n\n" + registry_import + "\n",
                  1,
              )

          completeness_start = text.index("class CompletenessWitnessMap:")
          completeness_end = text.index("\n\n@dataclass", completeness_start)
          completeness_block = text[completeness_start:completeness_end]
          if '"bounded_projection_id"' not in completeness_block.split(
              "if self.evidence_kind", 1
          )[0]:
              anchor = '        _require_text(self.justification, "justification")\n'
              insertion = (
                  anchor
                  + "        if self.bounded_projection_id is not None:\n"
                  + '            _require_text(self.bounded_projection_id, "bounded_projection_id")\n'
                  + "        if self.alternative_witness_id is not None:\n"
                  + '            _require_text(self.alternative_witness_id, "alternative_witness_id")\n'
              )
              completeness_block = completeness_block.replace(anchor, insertion, 1)
              text = text[:completeness_start] + completeness_block + text[completeness_end:]

          coverage_start = text.index("class CoverageTarget:")
          coverage_end = text.index("\n\n@dataclass", coverage_start)
          coverage_block = text[coverage_start:coverage_end]
          if "unknown_invariants" not in coverage_block:
              anchor = (
                  '        if not self.required_invariants:\n'
                  '            raise ContractValidationError("required_invariants must be nonempty")\n'
              )
              insertion = (
                  anchor
                  + "        unknown_invariants = (\n"
                  + "            self.required_invariants - EXECUTABLE_INVARIANT_IDS\n"
                  + "        )\n"
                  + "        if unknown_invariants:\n"
                  + "            raise ContractValidationError(\n"
                  + '                "required_invariants are not executable: "\n'
                  + "                f\"{sorted(unknown_invariants)}\"\n"
                  + "            )\n"
              )
              coverage_block = coverage_block.replace(anchor, insertion, 1)
              text = text[:coverage_start] + coverage_block + text[coverage_end:]
          path.write_text(text)
          PY
      - run: ruff format .
      - run: ruff check --fix .
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src
      - run: pytest
      - run: csd-foundry synthesize contracts --release v0.4
      - name: Commit contract integrity corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Bind synthesis targets to executable contracts"
          git push origin HEAD:web/10-synthesis-contracts-v0.4
