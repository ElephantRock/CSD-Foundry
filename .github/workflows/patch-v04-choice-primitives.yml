name: Integrate v0.4 deterministic choice primitives

on:
  push:
    branches: [web/12-deterministic-choice-primitives-v0.4]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Integrate policy, CLI, tests, and documentation
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def replace(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"missing patch anchor in {path}: {old[:80]!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Package the normative choice policy with the wheel.
          replace(
              "src/csd_foundry/synthesis/v0_4/specs.py",
              '    "deterministic_arithmetic_policy.schema.json",\n)',
              '    "deterministic_arithmetic_policy.schema.json",\n'
              '    "choice_algorithm.schema.json",\n)',
          )
          replace(
              "src/csd_foundry/synthesis/v0_4/specs.py",
              '    "root_seed": "csd-foundry-v0.4-release-seed",\n'
              '    "rng_algorithm": "sha256-integer-choice-path",\n'
              '    "rng_version": "0.4.0",\n'
              '    "choice_path_schema_version": "0.4.0",',
              '    "root_seed": "f44e3f73e886fb09389790455b985efd8bcfcc7e096940bcdbab3e0ebacecd1b",\n'
              '    "root_seed_provenance": "uniform-random-256",\n'
              '    "rng_algorithm": "csd-choice-hmac-sha256-rejection",\n'
              '    "rng_version": "1",\n'
              '    "choice_path_schema_version": "csd-choice-path/0.4",',
          )
          choice_spec = '''

CHOICE_ALGORITHM_SPEC: dict[str, object] = {
    "release": "v0.4",
    "schema_version": "0.4.0",
    "algorithm_id": "csd-choice-hmac-sha256-rejection",
    "algorithm_version": 1,
    "digest_primitive": "hmac-sha256",
    "root_seed_bytes": 32,
    "release_seed_encoding": "lowercase-hex",
    "release_seed_provenance": "uniform-random-256",
    "path_schema_version": "csd-choice-path/0.4",
    "identity_schema_version": "csd-identity/0.4",
    "draw_counter_encoding": "uint64-big-endian",
    "block_counter_encoding": "uint64-big-endian",
    "attempt_index_encoding": "uint32",
    "maximum_attempt_index": 4294967295,
    "candidate_byte_order": "big-endian",
    "display_digest_bits": 128,
    "design_identity_ceiling": 10000000,
    "collision_risk_ceiling_numerator": 15,
    "collision_risk_ceiling_denominator": 100000000000000000000000000,
    "semantic_floating_point_permitted": False,
}
'''
          replace(
              "src/csd_foundry/synthesis/v0_4/specs.py",
              '\nSPEC_DOCUMENTS: dict[str, dict[str, object]] = {',
              choice_spec + '\nSPEC_DOCUMENTS: dict[str, dict[str, object]] = {',
          )
          replace(
              "src/csd_foundry/synthesis/v0_4/specs.py",
              '    "deterministic_arithmetic_policy.json": DETERMINISTIC_ARITHMETIC_POLICY_SPEC,\n}',
              '    "deterministic_arithmetic_policy.json": DETERMINISTIC_ARITHMETIC_POLICY_SPEC,\n'
              '    "choice_algorithm.json": CHOICE_ALGORITHM_SPEC,\n}',
          )

          # Release policy must reference the frozen algorithm and a release-eligible seed.
          replace(
              "src/csd_foundry/synthesis/v0_4/contracts.py",
              '    root_seed: str\n    rng_algorithm: str',
              '    root_seed: str\n    root_seed_provenance: str\n    rng_algorithm: str',
          )
          replace(
              "src/csd_foundry/synthesis/v0_4/contracts.py",
              '            ("root_seed", self.root_seed),\n            ("rng_algorithm", self.rng_algorithm),',
              '            ("root_seed", self.root_seed),\n'
              '            ("root_seed_provenance", self.root_seed_provenance),\n'
              '            ("rng_algorithm", self.rng_algorithm),',
          )
          replace(
              "src/csd_foundry/synthesis/v0_4/contracts.py",
              '        if self.target_trajectory_count <= 0 or self.pilot_trajectory_count <= 0:',
              '        if _SHA256_PATTERN.fullmatch(self.root_seed) is None:\n'
              '            raise ContractValidationError("root_seed must be a lowercase 256-bit hex seed")\n'
              '        if self.root_seed_provenance != "uniform-random-256":\n'
              '            raise ContractValidationError("release root seed requires uniform-random-256 provenance")\n'
              '        if self.rng_algorithm != "csd-choice-hmac-sha256-rejection":\n'
              '            raise ContractValidationError("release policy must use the normative HMAC choice algorithm")\n'
              '        if self.rng_version != "1":\n'
              '            raise ContractValidationError("release policy rng_version must be 1")\n'
              '        if self.choice_path_schema_version != "csd-choice-path/0.4":\n'
              '            raise ContractValidationError("unsupported choice path schema version")\n'
              '        if self.target_trajectory_count <= 0 or self.pilot_trajectory_count <= 0:',
          )

          replace(
              "src/csd_foundry/synthesis/v0_4/validation.py",
              'from csd_foundry.synthesis.v0_4.contracts import (',
              'from csd_foundry.synthesis.v0_4.choice_policy import load_choice_algorithm_policy\n'
              'from csd_foundry.synthesis.v0_4.contracts import (',
          )
          replace(
              "src/csd_foundry/synthesis/v0_4/validation.py",
              '        root_seed=_string(data, "root_seed"),\n        rng_algorithm=_string(data, "rng_algorithm"),',
              '        root_seed=_string(data, "root_seed"),\n'
              '        root_seed_provenance=_string(data, "root_seed_provenance"),\n'
              '        rng_algorithm=_string(data, "rng_algorithm"),',
          )
          replace(
              "src/csd_foundry/synthesis/v0_4/validation.py",
              '            load_deterministic_arithmetic_policy()\n',
              '            load_deterministic_arithmetic_policy()\n'
              '            load_choice_algorithm_policy()\n',
          )
          replace(
              "src/csd_foundry/synthesis/v0_4/validation.py",
              '        policy_count=4,',
              '        policy_count=5,',
          )

          # CLI command.
          replace(
              "src/csd_foundry/cli.py",
              '    _add_release_argument(synthesis_contracts, default="v0.4")\n',
              '    _add_release_argument(synthesis_contracts, default="v0.4")\n'
              '    synthesis_determinism = synthesis_sub.add_parser(\n'
              '        "determinism",\n'
              '        help="validate deterministic choice primitives and frozen vectors",\n'
              '    )\n'
              '    _add_release_argument(synthesis_determinism, default="v0.4")\n',
          )
          replace(
