          }
          (root / "choice_algorithm.schema.json").write_text(
              json.dumps(choice_schema, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          release_schema = {
              "$id": "https://github.com/ElephantRock/CSD-Foundry/specs/v0.4/release_policy.schema.json",
              "$schema": "https://json-schema.org/draft/2020-12/schema",
              "title": "CSD Foundry v0.4 Release Policy",
              "type": "object",
              "additionalProperties": False,
              "properties": {
                  "release": {"const": "v0.4"},
                  "schema_version": {"const": "0.4.0"},
                  "target_trajectory_count": {"minimum": 1, "type": "integer"},
                  "pilot_trajectory_count": {"minimum": 1, "type": "integer"},
                  "maximum_trajectory_steps": {"minimum": 1, "type": "integer"},
                  "root_seed": {"pattern": "^[0-9a-f]{64}$", "type": "string"},
                  "root_seed_provenance": {"const": "uniform-random-256"},
                  "rng_algorithm": {"const": "csd-choice-hmac-sha256-rejection"},
                  "rng_version": {"const": "1"},
                  "choice_path_schema_version": {"const": "csd-choice-path/0.4"},
                  "split_hash_salt": {"minLength": 1, "type": "string"},
                  "performance_policy_status": {"enum": ["unfrozen", "frozen"]},
                  "stochastic_risk_policy_status": {"enum": ["unfrozen", "frozen"]},
                  "release_blocked_until_policies_frozen": {"type": "boolean"},
              },
              "required": list(RELEASE_POLICY_SPEC.keys()),
          }
          (root / "release_policy.schema.json").write_text(
              json.dumps(release_schema, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          canary = Path("data/canary/v0.4/algorithm-v1")
          canary.mkdir(parents=True, exist_ok=True)
          vector_document = {
              "release": "v0.4",
              "schema_version": "0.4.0",
              "algorithm_id": "csd-choice-hmac-sha256-rejection",
              "algorithm_version": 1,
              "vectors": list(KNOWN_ANSWER_VECTORS),
          }
          (canary / "choice_vectors.json").write_text(
              json.dumps(vector_document, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - run: ruff format .
      - run: ruff check --fix .
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src
      - run: pytest
      - run: python scripts/validate_csd_reasoning_seed.py --directory data/seed/v0.1
      - run: python -m compileall -q src scripts tests
      - run: csd-foundry scenarios validate --release v0.1
      - run: csd-foundry mutations evaluate --release v0.1
      - run: csd-foundry temporal validate --release v0.3
      - run: csd-foundry temporal mutations --release v0.3
      - run: csd-foundry synthesize contracts --release v0.4
      - run: csd-foundry synthesize determinism --release v0.4 --output reports/determinism_v0.4.json
      - run: pip wheel . --no-deps --wheel-dir /tmp/csd-wheelhouse
      - name: Validate installed wheel outside repository
        run: |
          python -m venv /tmp/csd-installed
          /tmp/csd-installed/bin/pip install /tmp/csd-wheelhouse/csd_foundry-*.whl
          cd /tmp
          /tmp/csd-installed/bin/csd-foundry synthesize contracts --release v0.4 > contracts.json
          /tmp/csd-installed/bin/csd-foundry synthesize determinism --release v0.4 > determinism.json
          test -s contracts.json
          test -s determinism.json
      - name: Commit integrated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-v04-choice-primitives.yml
          git add .
          git commit -m "Implement v0.4 deterministic choice primitives"
          git push
