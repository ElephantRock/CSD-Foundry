              '    if args.command == "synthesize" and args.synthesis_command == "determinism":\n'
              '        from csd_foundry.synthesis.v0_4.determinism_validation import (\n'
              '            validate_determinism,\n'
              '        )\n\n'
              '        determinism_result = validate_determinism(args.release)\n'
              '        _emit(determinism_result.to_dict(), args.output)\n'
              '        if not determinism_result.success:\n'
              '            raise SystemExit(1)\n'
              '        return\n\n'
              '    if args.command == "synthesize" and args.synthesis_command == "contracts":',
          )

          # Existing contract test counts now include the algorithm policy/schema.
          replace(
              "tests/synthesis_v0_4/test_contracts.py",
              '    assert report.schema_document_count == 6',
              '    assert report.schema_document_count == 7\n    assert report.policy_count == 5',
          )

          test_code = r'''from __future__ import annotations

import json
import os
import subprocess
import sys
from pathlib import Path

import pytest

from csd_foundry.synthesis.v0_4.choice_paths import (
    MAX_ATTEMPT_INDEX,
    AttemptKey,
    AttemptRange,
    ChoiceOperation,
    ChoicePath,
    ChoiceValidationError,
    RootSeed,
    SampleKey,
    SeedProvenance,
)
from csd_foundry.synthesis.v0_4.choice_policy import load_choice_algorithm_policy
from csd_foundry.synthesis.v0_4.choice_vectors import (
    KNOWN_ANSWER_SEED_HEX,
    KNOWN_ANSWER_VECTORS,
)
from csd_foundry.synthesis.v0_4.determinism_validation import validate_determinism
from csd_foundry.synthesis.v0_4.deterministic_choices import (
    bounded_integer,
    canonical_choice_material,
    choose_ratio,
    weighted_choice,
)
from csd_foundry.synthesis.v0_4.serialization import load_json_text
from csd_foundry.synthesis.v0_4.specs import CHOICE_ALGORITHM_SPEC, RELEASE_POLICY_SPEC

ROOT = Path(__file__).resolve().parents[2]


def _seed() -> RootSeed:
    return RootSeed.from_hex(
        KNOWN_ANSWER_SEED_HEX,
        SeedProvenance.KNOWN_ANSWER_FIXTURE,
    )


def _path(*segments: str | int, sample_index: int = 0) -> ChoicePath:
    return ChoicePath(
        AttemptKey(SampleKey("v0.4", "known-answer", sample_index), 0),
        "known-answer",
        tuple(segments),
    )


def test_determinism_release_and_required_vector_paths() -> None:
    report = validate_determinism("v0.4")
    assert report.success
    assert report.vectors_passed == len(KNOWN_ANSWER_VECTORS) == 7
    assert report.forced_redraw_vectors >= 1
    assert report.multiple_redraw_vectors >= 1
    assert report.multi_block_vectors >= 1
    assert report.typed_segment_separation
    assert report.release_seed_valid
    assert report.maximum_attempt_index == MAX_ATTEMPT_INDEX


def test_forced_redraw_resets_block_counter() -> None:
    result = bounded_integer(_seed(), _path("redraw", 1, sample_index=1), 129)
    assert result.draw_index == 2
    assert [draw.candidate_hex for draw in result.draws] == ["b8", "b1", "2e"]
    assert [draw.block_count for draw in result.draws] == [1, 1, 1]


def test_large_bound_uses_multiple_hmac_blocks() -> None:
    bound = (1 << 264) + 12345
    result = bounded_integer(_seed(), _path("large-bound", 1, sample_index=2), bound)
    assert result.width == 34
    assert result.block_count == 2
    assert 0 <= result.value < bound


def test_integer_and_string_segments_remain_distinct() -> None:
    integer_path = _path("segment", 1, sample_index=3)
    string_path = _path("segment", "1", sample_index=3)
    domain = {"upper_exclusive": 1000}
    assert canonical_choice_material(
        integer_path, ChoiceOperation.BOUNDED_INTEGER, domain
    ) != canonical_choice_material(string_path, ChoiceOperation.BOUNDED_INTEGER, domain)
    assert bounded_integer(_seed(), integer_path, 1000).value == 798
    assert bounded_integer(_seed(), string_path, 1000).value == 141


@pytest.mark.parametrize("bad_segment", [False, -1, "", "UPPER", "é"])
def test_invalid_choice_path_segments_fail_closed(bad_segment: object) -> None:
    with pytest.raises(ChoiceValidationError):
        ChoicePath(
            AttemptKey(SampleKey("v0.4", "known-answer", 0), 0),
            "known-answer",
            (bad_segment,),  # type: ignore[arg-type]
        )


def test_attempt_range_has_a_hard_uint32_ceiling() -> None:
    sample = SampleKey("v0.4", "known-answer", 0)
    assert AttemptKey(sample, MAX_ATTEMPT_INDEX).attempt_index == MAX_ATTEMPT_INDEX
    assert AttemptRange(MAX_ATTEMPT_INDEX + 1).contains(MAX_ATTEMPT_INDEX)
    with pytest.raises(ChoiceValidationError):
        AttemptKey(sample, MAX_ATTEMPT_INDEX + 1)
    with pytest.raises(ChoiceValidationError):
        AttemptRange(0)
    with pytest.raises(ChoiceValidationError):
        AttemptRange(MAX_ATTEMPT_INDEX + 2)


@pytest.mark.parametrize(
    "bound",
    [1, 2, 255, 256, 257, (1 << 32) - 1, 1 << 32, (1 << 32) + 1, (1 << 264) + 12345],
)
def test_bounded_integer_boundary_ranges(bound: int) -> None:
    result = bounded_integer(_seed(), _path("boundary", bound), bound)
    assert 0 <= result.value < bound


@pytest.mark.parametrize("bound", [0, -1, 1.5, True])
def test_invalid_bounded_integer_domains_fail_closed(bound: object) -> None:
    with pytest.raises(ChoiceValidationError):
        bounded_integer(_seed(), _path("bad-bound"), bound)  # type: ignore[arg-type]


def test_weighted_choice_uses_exact_positive_integer_weights() -> None:
    result = weighted_choice(
        _seed(),
        _path("weighted", "status", sample_index=4),
        ["a", "b", "c"],
        [3, 7, 11],
    )
    assert result.selected_index == 1
    assert result.selected_value == "b"
    assert result.ticket.value == 7
    assert result.cumulative_weights == (3, 10, 21)

    for weights in ([], [1, 0], [1, -1], [1, True]):
        with pytest.raises(ChoiceValidationError):
            weighted_choice(_seed(), _path("bad-weight"), ["a", "b"], weights)
    with pytest.raises(ChoiceValidationError):
        weighted_choice(_seed(), _path("duplicates"), ["a", "a"], [1, 1])


def test_exact_ratio_rejects_invalid_ratios() -> None:
    assert choose_ratio(_seed(), _path("ratio", "flag", sample_index=5), 2, 5).selected
    for numerator, denominator in ((-1, 5), (6, 5), (1, 0), (True, 5)):
        with pytest.raises(ChoiceValidationError):
            choose_ratio(
                _seed(),
                _path("bad-ratio"),
                numerator,  # type: ignore[arg-type]
                denominator,
            )


def test_release_seed_is_explicit_and_release_eligible() -> None:
    raw = RELEASE_POLICY_SPEC["root_seed"]
    provenance = RELEASE_POLICY_SPEC["root_seed_provenance"]
    assert isinstance(raw, str)
    assert isinstance(provenance, str)
    seed = RootSeed.from_hex(raw, SeedProvenance(provenance))
    assert seed.release_eligible
    with pytest.raises(ChoiceValidationError):
        RootSeed.from_text("test", SeedProvenance.UNIFORM_RANDOM_256)
    with pytest.raises(ChoiceValidationError):
        RootSeed.from_hex("00" * 32, SeedProvenance.UNIFORM_RANDOM_256)


def test_choice_policy_satisfies_exact_collision_bound() -> None:
    policy = load_choice_algorithm_policy()
    assert policy.display_digest_bits == 128
    assert policy.design_identity_ceiling == 10_000_000
    assert policy.collision_probability_upper_bound <= policy.collision_risk_ceiling


def test_repository_policy_and_vector_catalog_match_packaged_values() -> None:
    policy = load_json_text(
        (ROOT / "specs/v0.4/choice_algorithm.json").read_text(encoding="utf-8")
    )
    vector_document = load_json_text(
        (ROOT / "data/canary/v0.4/algorithm-v1/choice_vectors.json").read_text(
            encoding="utf-8"
        )
    )
    assert policy == CHOICE_ALGORITHM_SPEC
    assert isinstance(vector_document, dict)
    assert vector_document["vectors"] == list(KNOWN_ANSWER_VECTORS)


def test_choice_result_is_independent_of_python_hash_seed() -> None:
    script = """
from csd_foundry.synthesis.v0_4.choice_paths import AttemptKey, ChoicePath, RootSeed, SampleKey, SeedProvenance
from csd_foundry.synthesis.v0_4.choice_vectors import KNOWN_ANSWER_SEED_HEX
from csd_foundry.synthesis.v0_4.deterministic_choices import bounded_integer
seed = RootSeed.from_hex(KNOWN_ANSWER_SEED_HEX, SeedProvenance.KNOWN_ANSWER_FIXTURE)
path = ChoicePath(AttemptKey(SampleKey('v0.4', 'known-answer', 1), 0), 'known-answer', ('redraw', 1))
result = bounded_integer(seed, path, 129)
print(result.material_digest + ':' + str(result.value) + ':' + str(result.draw_index))
"""
    outputs = set()
    for hash_seed in ("0", "1", "42", "random"):
        environment = dict(os.environ)
        environment["PYTHONHASHSEED"] = hash_seed
        completed = subprocess.run(
            [sys.executable, "-c", script],
            check=True,
            capture_output=True,
            text=True,
            env=environment,
        )
        outputs.add(completed.stdout.strip())
    assert len(outputs) == 1


def test_choice_algorithm_schema_is_normative() -> None:
    schema = json.loads(
        (ROOT / "specs/v0.4/choice_algorithm.schema.json").read_text(encoding="utf-8")
    )
    assert schema["properties"]["algorithm_id"]["const"] == (
        "csd-choice-hmac-sha256-rejection"
    )
    assert schema["properties"]["digest_primitive"]["const"] == "hmac-sha256"
    assert schema["properties"]["maximum_attempt_index"]["const"] == 4294967295
'''
          test_path = Path("tests/synthesis_v0_4/test_deterministic_choices.py")
          test_path.write_text(test_code, encoding="utf-8")

          docs = '''# CSD Foundry v0.4 Deterministic Choices

## Normative algorithm

Algorithm version 1 is `csd-choice-hmac-sha256-rejection`. It uses only
HMAC-SHA-256. Plain concatenated SHA-256 is not an alternative implementation.

The HMAC key is the exact 32-byte root seed. The message is:

```text
b"csd-choice-hmac-sha256-rejection/v1\\x00"
|| uint64_be(len(canonical_material))
|| canonical_material
|| uint64_be(draw_index)
|| uint64_be(block_index)
```

Both counters are local to one choice, zero-based, unsigned 64-bit, and big-endian.
Canonical material is the existing integer-only canonical JSON representation, including its
terminal newline.

## Rejection and redraw

For bound `u`, candidate width is the smallest whole-byte width representing `u - 1`, with a
minimum of one byte. `limit = 256**width - (256**width % u)`. Blocks are concatenated in ascending
block-index order and truncated to the candidate width. A candidate below `limit` returns
`candidate % u`.

A rejected candidate is discarded completely. The next draw increments `draw_index`, resets
`block_index` to zero, and derives a new candidate. Rejected bytes are never reused. Frozen
known-answer vectors include two consecutive rejected draws and a 34-byte candidate requiring two
HMAC blocks.

## Attempts and timeouts

Attempt indices are unsigned 32-bit values. A declared attempt range contains between one and
2^32 attempts. The accepted result is the lowest valid attempt index. Speculative parallel
execution cannot commit a higher successful attempt until every lower attempt is resolved; this is
a deliberate correctness-over-throughput trade-off.

Wall-clock expiry is an operational worker failure, not semantic search exhaustion. An interrupted
sample must be rescheduled from its immutable sample key. Future shard sealing must reject missing,
unexpected, or conflicting sample completions.

## Seeds

Release mode requires exactly 32 bytes represented as 64 lowercase hexadecimal characters and
`uniform-random-256` provenance. Text-derived seeds are restricted to development and frozen
known-answer fixtures and are release-ineligible.

## Identity sizing and immutability

The future display-identity layer is pinned to at least 128 digest bits for a design ceiling of ten
million identities. The exact birthday-bound upper estimate must remain below the exact policy
ceiling.

Once canary, pilot, or release evidence is committed under algorithm version 1, it is immutable.
Any behavior-affecting change requires a new algorithm version and a coexisting artifact namespace;
it cannot rewrite version-1 evidence.

## Claim boundary

Passing deterministic validation establishes the algorithm, seed, path, counter, and committed
known-answer-vector contract. It does not establish entity identity allocation, production shard
orchestration, planner completeness, state construction, or release-scale output.
'''
          Path("docs/DETERMINISTIC_CHOICES_V0_4.md").write_text(docs, encoding="utf-8")

          # Update README command and status without broad rewriting.
          replace(
              "README.md",
              'csd-foundry synthesize contracts --release v0.4\n',
              'csd-foundry synthesize contracts --release v0.4\n'
