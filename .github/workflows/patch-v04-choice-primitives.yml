          )

          choice_schema = {
              "$id": "https://github.com/ElephantRock/CSD-Foundry/specs/v0.4/choice_algorithm.schema.json",
              "$schema": "https://json-schema.org/draft/2020-12/schema",
              "title": "CSD Foundry v0.4 Deterministic Choice Algorithm",
              "type": "object",
              "additionalProperties": False,
              "properties": {
                  "release": {"const": "v0.4"},
                  "schema_version": {"const": "0.4.0"},
                  "algorithm_id": {"const": "csd-choice-hmac-sha256-rejection"},
                  "algorithm_version": {"const": 1},
                  "digest_primitive": {"const": "hmac-sha256"},
                  "root_seed_bytes": {"const": 32},
                  "release_seed_encoding": {"const": "lowercase-hex"},
                  "release_seed_provenance": {"const": "uniform-random-256"},
                  "path_schema_version": {"const": "csd-choice-path/0.4"},
                  "identity_schema_version": {"const": "csd-identity/0.4"},
                  "draw_counter_encoding": {"const": "uint64-big-endian"},
                  "block_counter_encoding": {"const": "uint64-big-endian"},
                  "attempt_index_encoding": {"const": "uint32"},
                  "maximum_attempt_index": {"const": 4294967295},
                  "candidate_byte_order": {"const": "big-endian"},
                  "display_digest_bits": {"minimum": 128, "multipleOf": 8, "type": "integer"},
                  "design_identity_ceiling": {"minimum": 1, "type": "integer"},
                  "collision_risk_ceiling_numerator": {"minimum": 1, "type": "integer"},
                  "collision_risk_ceiling_denominator": {"minimum": 1, "type": "integer"},
                  "semantic_floating_point_permitted": {"const": False},
              },
