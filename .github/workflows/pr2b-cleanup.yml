name: PR 2B Annotation Cleanup

on:
  pull_request:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e '.[dev]'
      - name: Remove duplicate branch annotations
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/csd_foundry/synthesis/v0_4/replay_validation.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "    completion: AttemptAccepted | AttemptRejected\n" * 3,
              "    completion: AttemptAccepted | AttemptRejected\n",
          )
          text = text.replace(
              "    tampered_record: ChoiceRecord\n" * 3,
              "    tampered_record: ChoiceRecord\n",
          )
          path.write_text(text, encoding="utf-8")
          PY
      - run: ruff format src/csd_foundry/synthesis/v0_4/replay_validation.py
      - run: ruff check src/csd_foundry/synthesis/v0_4/replay_validation.py
      - name: Commit annotation cleanup
        run: |
          git config user.name "csd-foundry-ci"
          git config user.email "actions@users.noreply.github.com"
          git add src/csd_foundry/synthesis/v0_4/replay_validation.py
          git commit -m "Remove duplicate replay annotations"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      - run: mypy src
      - run: pytest
      - name: Print generated replay digests
        run: |
          python - <<'PY'
          import json
          from csd_foundry.synthesis.v0_4.replay_validation import generate_replay_digests
          print(json.dumps(generate_replay_digests(), indent=2, sort_keys=True))
          PY
