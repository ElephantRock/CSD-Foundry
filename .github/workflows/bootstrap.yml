name: Diagnose bootstrap chunk halves

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: web/1-bootstrap-csd-foundry
          fetch-depth: 0
      - name: Report suspect half digests
        shell: bash
        run: |
          set -euo pipefail
          for name in part0204 part0212; do
            head -c 4000 ".bootstrap/$name" > "/tmp/${name}a"
            tail -c 4000 ".bootstrap/$name" > "/tmp/${name}b"
          done
          sha256sum /tmp/part0204a /tmp/part0204b /tmp/part0212a /tmp/part0212b
          exit 1
