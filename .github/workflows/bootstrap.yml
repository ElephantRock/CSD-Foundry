name: Diagnose bootstrap chunks

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: web/1-bootstrap-csd-foundry
          fetch-depth: 0
      - name: Report chunk sizes and digests
        shell: bash
        run: |
          set -euo pipefail
          wc -c .bootstrap/part*
          sha256sum .bootstrap/part*
          cat .bootstrap/part* | base64 -d > /tmp/csd-foundry-bootstrap.zip
          sha256sum /tmp/csd-foundry-bootstrap.zip
          unzip -t /tmp/csd-foundry-bootstrap.zip || true
          exit 1
