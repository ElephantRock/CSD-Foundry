name: Materialize and validate bootstrap

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: web/1-bootstrap-csd-foundry
          fetch-depth: 0

      - name: Repair, reconstruct, and verify archive
        shell: bash
        run: |
          set -euo pipefail
          {
            tr -d '\r\n' < .bootstrap/fix0204a
            tail -c 4000 .bootstrap/part0204
          } > /tmp/part0204
          {
            head -c 4000 .bootstrap/part0212
            tr -d '\r\n' < .bootstrap/fix0212b
          } > /tmp/part0212
          mv /tmp/part0204 .bootstrap/part0204
          mv /tmp/part0212 .bootstrap/part0212
          rm .bootstrap/fix0204a .bootstrap/fix0212b
          cat .bootstrap/part* | base64 -d > /tmp/csd-foundry-bootstrap.zip
          echo "41483b55f156c628e478f4e4f40fd576ebb5661fecf6116a4a47f423a9616c52  /tmp/csd-foundry-bootstrap.zip" | sha256sum -c -
          unzip -tq /tmp/csd-foundry-bootstrap.zip

      - name: Materialize validated project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/csd-foundry-bootstrap
          mkdir -p /tmp/csd-foundry-bootstrap
          unzip -q /tmp/csd-foundry-bootstrap.zip -d /tmp/csd-foundry-bootstrap
          cp -a /tmp/csd-foundry-bootstrap/CSD-Foundry/. .
          rm -rf .bootstrap .github/workflows/bootstrap.yml
          cat >> pyproject.toml <<'EOF'

          [tool.ruff.lint.per-file-ignores]
          "scripts/generate_csd_reasoning_seed.py" = ["E501"]
          EOF
          python - <<'PY'
          from pathlib import Path

          transitions = Path("src/csd_foundry/kernel/transitions.py")
          text = transitions.read_text(encoding="utf-8")
          old = """    elif state.assurance in {Assurance.PASS, Assurance.PARTIAL, Assurance.FAIL}:\n        if not verdict_survivors:\n            resulting_assurance = Assurance.STALE\n"""
          new = """    elif (\n        state.assurance in {Assurance.PASS, Assurance.PARTIAL, Assurance.FAIL}\n        and not verdict_survivors\n    ):\n        resulting_assurance = Assurance.STALE\n"""
          if old not in text:
              raise SystemExit("expected transition source pattern not found")
          transitions.write_text(text.replace(old, new), encoding="utf-8")

          invariants = Path("src/csd_foundry/kernel/invariants.py")
          text = invariants.read_text(encoding="utf-8")
          old = """    for basis_id, old in before_bases.items():\n        new = after_bases.get(basis_id)\n        if new is None:\n            violations.append(Violation(\"INV-19\", f\"basis {basis_id} was deleted\"))\n        elif old != new:\n            violations.append(Violation(\"G-INV-11\", f\"basis {basis_id} was rewritten\"))\n"""
          new = """    for basis_id, old_basis in before_bases.items():\n        new_basis = after_bases.get(basis_id)\n        if new_basis is None:\n            violations.append(Violation(\"INV-19\", f\"basis {basis_id} was deleted\"))\n        elif old_basis != new_basis:\n            violations.append(Violation(\"G-INV-11\", f\"basis {basis_id} was rewritten\"))\n"""
          if old not in text:
              raise SystemExit("expected invariant source pattern not found")
          invariants.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install development environment
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Format and validate materialized project
        shell: bash
        run: |
          set -euo pipefail
          ruff format .
          ruff check --fix .
          ruff format .
          ruff format --check .
          ruff check .
          mypy src
          pytest
          python scripts/validate_csd_reasoning_seed.py --directory data/seed/v0.1
          python -m compileall -q src fixtures scripts tests

      - name: Commit materialized project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: materialize validated CSD Foundry bootstrap"
          git push origin HEAD:web/1-bootstrap-csd-foundry
