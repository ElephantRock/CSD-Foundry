name: Fix v0.4 release seed gates

on:
  pull_request:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Apply shared release-seed validation
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          contracts_path = Path("src/csd_foundry/synthesis/v0_4/contracts.py")
          contracts = contracts_path.read_text(encoding="utf-8")
          import_anchor = (
              "from csd_foundry.kernel.invariant_registry import "
              "EXECUTABLE_INVARIANT_IDS\n"
          )
          import_replacement = import_anchor + (
              "from csd_foundry.synthesis.v0_4.choice_paths import (\n"
              "    ChoiceValidationError,\n"
              "    RootSeed,\n"
              "    SeedProvenance,\n"
              ")\n"
          )
          if import_anchor not in contracts:
              raise SystemExit("contracts import anchor missing")
          contracts = contracts.replace(import_anchor, import_replacement, 1)

          start_marker = "        if _SHA256_PATTERN.fullmatch(self.root_seed) is None:\n"
          end_marker = "        if self.rng_algorithm != \"csd-choice-hmac-sha256-rejection\":\n"
          start = contracts.find(start_marker)
          end = contracts.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit("release-policy seed block markers missing")
          replacement = (
              "        try:\n"
              "            release_seed = RootSeed.from_hex(\n"
              "                self.root_seed,\n"
              "                SeedProvenance(self.root_seed_provenance),\n"
              "            )\n"
              "        except (ChoiceValidationError, ValueError) as exc:\n"
              "            raise ContractValidationError(\n"
              "                f\"invalid release root seed: {exc}\"\n"
              "            ) from exc\n"
              "        if not release_seed.release_eligible:\n"
              "            raise ContractValidationError(\n"
              "                \"release root seed requires uniform-random-256 provenance\"\n"
              "            )\n"
          )
          contracts = contracts[:start] + replacement + contracts[end:]
          contracts_path.write_text(contracts, encoding="utf-8")

          determinism_path = Path(
              "src/csd_foundry/synthesis/v0_4/determinism_validation.py"
          )
          determinism = determinism_path.read_text(encoding="utf-8")
          line = "        release_seed_valid = release_seed.release_eligible\n"
          replacement_line = line + (
              "        if not release_seed_valid:\n"
              "            errors.append(\n"
              "                \"release seed provenance is valid syntax but is not "
              "release eligible\"\n"
              "            )\n"
          )
          if determinism.count(line) != 1:
              raise SystemExit("determinism seed-validity anchor missing or ambiguous")
          determinism_path.write_text(
              determinism.replace(line, replacement_line, 1),
              encoding="utf-8",
          )

          schema_path = Path("specs/v0.4/release_policy.schema.json")
          schema = json.loads(schema_path.read_text(encoding="utf-8"))
          schema["properties"]["root_seed"] = {
              "allOf": [
                  {"pattern": "^[0-9a-f]{64}$"},
                  {"not": {"pattern": "^([0-9a-f]{2})\\1{31}$"}},
              ],
              "type": "string",
          }
          schema_path.write_text(
              json.dumps(schema, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          test_path = Path("tests/synthesis_v0_4/test_deterministic_choices.py")
          tests = test_path.read_text(encoding="utf-8")
          tests_import = '''from csd_foundry.synthesis.v0_4.specs import (
              CHOICE_ALGORITHM_SPEC,
              RELEASE_POLICY_SPEC,
          )
          '''
          tests_import_replacement = tests_import + '''from csd_foundry.synthesis.v0_4.validation import (
              validate_release as validate_contract_release,
          )
          '''
          if tests_import not in tests:
              raise SystemExit("test import anchor missing")
          tests = tests.replace(tests_import, tests_import_replacement, 1)

          insertion = '''def test_determinism_rejects_release_ineligible_seed_provenance() -> None:
              original = RELEASE_POLICY_SPEC["root_seed_provenance"]
              try:
                  RELEASE_POLICY_SPEC["root_seed_provenance"] = "developer-text"
                  report = validate_determinism("v0.4")
                  assert not report.success
                  assert not report.release_seed_valid
                  assert any("not release eligible" in error for error in report.errors)
              finally:
                  RELEASE_POLICY_SPEC["root_seed_provenance"] = original


          @pytest.mark.parametrize("fixture_seed", ["00" * 32, "ab" * 32])
          def test_contract_rejects_repeated_byte_release_seed(fixture_seed: str) -> None:
              original = RELEASE_POLICY_SPEC["root_seed"]
              try:
                  RELEASE_POLICY_SPEC["root_seed"] = fixture_seed
                  report = validate_contract_release("v0.4")
                  assert not report.success
                  assert any("repeated-byte fixture" in error for error in report.errors)
              finally:
                  RELEASE_POLICY_SPEC["root_seed"] = original


          '''
          insertion_anchor = "def test_choice_policy_satisfies_exact_collision_bound() -> None:\n"
          if insertion_anchor not in tests:
              raise SystemExit("test insertion anchor missing")
          tests = tests.replace(insertion_anchor, insertion + insertion_anchor, 1)
          test_path.write_text(tests, encoding="utf-8")
          PY
      - run: ruff format src tests
      - run: ruff check --fix src tests
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src
      - run: pytest
      - run: csd-foundry synthesize contracts --release v0.4
      - run: csd-foundry synthesize determinism --release v0.4
      - name: Commit corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src specs tests
          git commit -m "Enforce release-eligible seed material"
          git push
