name: Format v0.4 vector pin

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: |
          ruff format src/csd_foundry/synthesis/v0_4/determinism_validation.py
          ruff check --fix src/csd_foundry/synthesis/v0_4/determinism_validation.py
          ruff format --check src/csd_foundry/synthesis/v0_4/determinism_validation.py
          ruff check src/csd_foundry/synthesis/v0_4/determinism_validation.py
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/csd_foundry/synthesis/v0_4/determinism_validation.py
          git diff --cached --quiet || git commit -m "Format frozen vector digest gate"
          git push
