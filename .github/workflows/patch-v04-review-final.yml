name: Finalize v0.4 review corrections

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: web/10-synthesis-contracts-v0.4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Apply and complete the review migration
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path(".github/workflows/ci.yml").read_text()
          prefix = "          python - <<'PY'\n"
          suffix = "\n          PY\n      - run: ruff format ."
          start = workflow.index(prefix) + len(prefix)
          end = workflow.index(suffix, start)
          exec(textwrap.dedent(workflow[start:end]), {})

          path = Path("src/csd_foundry/synthesis/v0_4/contracts.py")
          text = path.read_text()
          marker = "@dataclass(frozen=True, slots=True)\nclass MutationRiskPolicy:\n"
          start = text.index(marker)
          replacement = '''@dataclass(frozen=True, slots=True)
          class MutationRiskPolicy:
              release: str
              confidence_level_decimal: str
              policy_status: str
              budgets: tuple[MutationRiskBudget, ...]

              def __post_init__(self) -> None:
                  _require_text(self.release, "release")
                  if (
                      _DECIMAL_PATTERN.fullmatch(self.confidence_level_decimal) is None
                      or Decimal(self.confidence_level_decimal) <= 0
                  ):
                      raise ContractValidationError(
                          "confidence level must be an exact decimal string greater than zero "
                          "and at most one"
                      )
                  if self.policy_status not in {"unfrozen", "frozen"}:
                      raise ContractValidationError(
                          "mutation risk policy status must be frozen or unfrozen"
                      )
                  severities = tuple(item.severity for item in self.budgets)
                  if len(severities) != len(set(severities)):
                      raise ContractValidationError(
                          "mutation risk policy has duplicate severity budgets"
                      )
                  if set(severities) != set(EscapeSeverity):
                      raise ContractValidationError(
                          "mutation risk policy must cover every severity"
                      )
                  if self.policy_status == "frozen" and not self.is_calibrated:
                      raise ContractValidationError(
                          "frozen mutation risk policy requires positive samples and confidence "
                          "bounds for every severity"
                      )

              @property
              def is_calibrated(self) -> bool:
                  return bool(
                      self.policy_status == "frozen"
                      and all(
                          item.minimum_invalid_mutants > 0
                          and item.upper_confidence_bound_decimal is not None
                          for item in self.budgets
                      )
                  )
          '''
          path.write_text(text[:start] + replacement)
          PY
      - run: ruff format .
      - run: ruff check --fix --unsafe-fixes .
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src
      - run: pytest
      - name: Commit review corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Harden frozen synthesis policy evidence"
          git push origin HEAD:web/10-synthesis-contracts-v0.4
