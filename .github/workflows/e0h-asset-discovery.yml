name: E0-H Dependency Discovery

on:
  pull_request:
    paths:
      - ".github/workflows/e0h-asset-discovery.yml"
      - "experiments/e0h/v1/run_inputs.json"

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.13"
      - run: python -m pip install --upgrade pip
      - name: Resolve and hash exact CUDA 12.8 wheel graph
        run: |
          python -m pip download \
            --dest /tmp/e0h-wheels \
            --only-binary=:all: \
            --extra-index-url https://download.pytorch.org/whl/cu128 \
            torch==2.8.0 \
            transformers==4.55.0 \
            accelerate==1.10.0 \
            jsonschema==4.26.0
          python - <<'PY'
          import email.parser
          import hashlib
          import json
          import pathlib
          import re
          import zipfile

          def normalized(value: str) -> str:
              return re.sub(r"[-_.]+", "-", value).lower()

          packages = []
          wheel_directory = pathlib.Path("/tmp/e0h-wheels")
          wheels = sorted(wheel_directory.glob("*.whl"))
          if not wheels:
              raise RuntimeError("resolver produced no wheels")
          for wheel in wheels:
              with zipfile.ZipFile(wheel) as archive:
                  metadata_names = [
                      name for name in archive.namelist() if name.endswith(".dist-info/METADATA")
                  ]
                  if len(metadata_names) != 1:
                      raise RuntimeError(f"wheel metadata is ambiguous: {wheel.name}")
                  message = email.parser.BytesParser().parsebytes(
                      archive.read(metadata_names[0])
                  )
              name = message.get("Name")
              version = message.get("Version")
              if not name or not version:
                  raise RuntimeError(f"wheel metadata lacks name/version: {wheel.name}")
              content = wheel.read_bytes()
              packages.append(
                  {
                      "name": normalized(name),
                      "version": version,
                      "filename": wheel.name,
                      "sha256": hashlib.sha256(content).hexdigest(),
                      "size_bytes": len(content),
                  }
              )
          packages.sort(key=lambda item: item["name"])
          names = [item["name"] for item in packages]
          if len(names) != len(set(names)):
              raise RuntimeError("resolved wheel names are not unique")
          payload = {
              "schema_version": "e0h-python-lock/1",
              "python_version": "3.11.13",
              "extra_index_url": "https://download.pytorch.org/whl/cu128",
              "packages": packages,
          }
          canonical = json.dumps(payload, sort_keys=True, separators=(",", ":")).encode("utf-8")
          payload["lock_digest"] = hashlib.sha256(canonical).hexdigest()
          path = pathlib.Path("/tmp/e0h-python-lock.json")
          path.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(path.read_text(encoding="utf-8"))
          PY
      - name: Compile exact E0-H run release
        run: |
          python -m pip install -e .
          python -m csd_foundry.empirical.e0h.run_release_cli compile \
            --inputs experiments/e0h/v1/run_inputs.json \
            --output-dir /tmp/e0h-compiled-release
          python -m csd_foundry.empirical.e0h.run_release_cli validate \
            --inputs experiments/e0h/v1/run_inputs.json \
            --output-dir /tmp/e0h-compiled-release
      - uses: actions/upload-artifact@v4
        with:
          name: e0h-freeze-artifacts
          path: |
            /tmp/e0h-python-lock.json
            /tmp/e0h-compiled-release
          if-no-files-found: error
          retention-days: 1
