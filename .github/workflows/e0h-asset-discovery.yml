name: E0-H Freeze Verification

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.13"
      - run: python -m pip install --upgrade pip
      - name: Resolve and hash exact CUDA 12.8 wheel graph
        run: |
          python -m pip download \
            --dest /tmp/e0h-wheels \
            --only-binary=:all: \
            --extra-index-url https://download.pytorch.org/whl/cu128 \
            torch==2.8.0 \
            transformers==4.55.0 \
            accelerate==1.10.0 \
            jsonschema==4.26.0
          python - <<'PY'
          import email.parser
          import hashlib
          import json
          import pathlib
          import re
          import zipfile

          def normalized(value: str) -> str:
              return re.sub(r"[-_.]+", "-", value).lower()

          packages = []
          wheel_directory = pathlib.Path("/tmp/e0h-wheels")
          wheels = sorted(wheel_directory.glob("*.whl"))
          if not wheels:
              raise RuntimeError("resolver produced no wheels")
          for wheel in wheels:
              with zipfile.ZipFile(wheel) as archive:
                  metadata_names = [
                      name
                      for name in archive.namelist()
                      if name.count("/") == 1 and name.endswith(".dist-info/METADATA")
                  ]
                  if len(metadata_names) != 1:
                      raise RuntimeError(
                          f"wheel top-level metadata is ambiguous: {wheel.name}; "
                          f"candidates={metadata_names}"
                      )
                  message = email.parser.BytesParser().parsebytes(
                      archive.read(metadata_names[0])
                  )
              name = message.get("Name")
              version = message.get("Version")
              if not name or not version:
                  raise RuntimeError(f"wheel metadata lacks name/version: {wheel.name}")
              content = wheel.read_bytes()
              packages.append(
                  {
                      "name": normalized(name),
                      "version": version,
                      "filename": wheel.name,
                      "sha256": hashlib.sha256(content).hexdigest(),
                      "size_bytes": len(content),
                  }
              )
          packages.sort(key=lambda item: item["name"])
          names = [item["name"] for item in packages]
          if len(names) != len(set(names)):
              raise RuntimeError("resolved wheel names are not unique")
          payload = {
              "schema_version": "e0h-python-lock/1",
              "python_version": "3.11.13",
              "extra_index_url": "https://download.pytorch.org/whl/cu128",
              "packages": packages,
          }
          canonical = json.dumps(payload, sort_keys=True, separators=(",", ":")).encode("utf-8")
          payload["lock_digest"] = hashlib.sha256(canonical).hexdigest()
          path = pathlib.Path("/tmp/e0h-python-lock.json")
          path.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          committed = json.loads(
              pathlib.Path("experiments/e0h/v1/python_lock.json").read_text(encoding="utf-8")
          )
          if payload != committed:
              raise RuntimeError("resolved Python graph differs from the committed lock")
          print(path.read_text(encoding="utf-8"))
          PY
      - name: Compile and compare exact E0-H release
        run: |
          python -m pip install -e .
          python -m csd_foundry.empirical.e0h.run_release_cli compile \
            --inputs experiments/e0h/v1/run_inputs.json \
            --output-dir /tmp/e0h-compiled-release
          python -m csd_foundry.empirical.e0h.run_release_cli validate \
            --inputs experiments/e0h/v1/run_inputs.json \
            --output-dir /tmp/e0h-compiled-release
          python - <<'PY'
          from pathlib import Path

          generated = Path("/tmp/e0h-compiled-release")
          committed = Path("experiments/e0h/v1/compiled_release")
          generated_names = {path.name for path in generated.iterdir()}
          committed_names = {path.name for path in committed.iterdir()}
          if generated_names != committed_names:
              raise RuntimeError(
                  f"compiled release file-set mismatch: "
                  f"generated={sorted(generated_names)}, committed={sorted(committed_names)}"
              )
          for name in sorted(generated_names):
              if (generated / name).read_bytes() != (committed / name).read_bytes():
                  raise RuntimeError(f"compiled release byte mismatch: {name}")
          PY
      - name: Verify committed package locks
        run: |
          python - <<'PY'
          from csd_foundry.empirical.e0h.harness.common import RunPaths, load_inputs
          from csd_foundry.empirical.e0h.harness.package_lock import verify_python_lock

          paths = RunPaths.resolve("experiments/e0h/v1")
          inputs = load_inputs(paths)
          verify_python_lock(paths, inputs)
          PY
      - name: Generate execution-package manifest
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          from csd_foundry.empirical.e0h.harness.package_manifest import (
              expected_execution_package_paths,
          )

          claim_boundary = (
              "The execution-package manifest binds repository bytes needed to reconstruct and "
              "run E0-H. It does not authorize GPU execution, protected metrics, E1 execution, "
              "or a reasoning claim."
          )
          root = Path.cwd()
          receipts = []
          for relative in sorted(expected_execution_package_paths()):
              path = root / relative
              if path.is_symlink() or not path.is_file():
                  raise RuntimeError(f"execution-package member is not a regular file: {relative}")
              content = path.read_bytes()
              receipts.append(
                  {
                      "path": relative,
                      "sha256": hashlib.sha256(content).hexdigest(),
                      "size_bytes": len(content),
                  }
              )
          inputs = json.loads(
              (root / "experiments/e0h/v1/run_inputs.json").read_text(encoding="utf-8")
          )
          python_lock = json.loads(
              (root / "experiments/e0h/v1/python_lock.json").read_text(encoding="utf-8")
          )
          run_contract = root / "experiments/e0h/v1/compiled_release/e0h_run_contract.json"
          payload = {
              "schema_version": "e0h-execution-package-manifest/1",
              "compiler_base_commit": inputs["source_commit"],
              "run_contract_digest": hashlib.sha256(run_contract.read_bytes()).hexdigest(),
              "python_lock_digest": python_lock["lock_digest"],
              "file_count": len(receipts),
              "files": receipts,
              "gpu_execution_authorized": False,
              "claim_boundary": claim_boundary,
          }
          output = Path("/tmp/execution_package_manifest.json")
          output.write_text(
              json.dumps(payload, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          print(output.read_text(encoding="utf-8"))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: e0h-freeze-verification
          path: |
            /tmp/e0h-python-lock.json
            /tmp/e0h-compiled-release
            /tmp/execution_package_manifest.json
          if-no-files-found: error
          retention-days: 1
