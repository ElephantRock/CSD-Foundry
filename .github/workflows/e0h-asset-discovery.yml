name: E0-H Dependency Discovery

on:
  pull_request:
    paths:
      - ".github/workflows/e0h-asset-discovery.yml"
      - "experiments/e0h/v1/run_inputs.json"

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.13"
      - run: python -m pip install --upgrade pip
      - name: Resolve exact CUDA 12.8 dependency graph
        run: |
          python -m pip install \
            --dry-run \
            --ignore-installed \
            --report /tmp/e0h-python-lock.raw.json \
            --extra-index-url https://download.pytorch.org/whl/cu128 \
            torch==2.8.0 \
            transformers==4.55.0 \
            accelerate==1.10.0
          python - <<'PY'
          import hashlib
          import json
          import pathlib

          raw_path = pathlib.Path("/tmp/e0h-python-lock.raw.json")
          raw = json.loads(raw_path.read_text(encoding="utf-8"))
          packages = []
          for item in raw["install"]:
              metadata = item["metadata"]
              archive = item["download_info"]["archive_info"]
              packages.append(
                  {
                      "name": metadata["name"].lower().replace("_", "-"),
                      "version": metadata["version"],
                      "url": item["download_info"]["url"],
                      "sha256": archive["hashes"]["sha256"],
                  }
              )
          packages.sort(key=lambda item: item["name"])
          payload = {
              "schema_version": "e0h-python-lock/1",
              "python_version": "3.11.13",
              "extra_index_url": "https://download.pytorch.org/whl/cu128",
              "packages": packages,
          }
          canonical = json.dumps(payload, sort_keys=True, separators=(",", ":")).encode("utf-8")
          payload["lock_digest"] = hashlib.sha256(canonical).hexdigest()
          path = pathlib.Path("/tmp/e0h-python-lock.json")
          path.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(path.read_text(encoding="utf-8"))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: e0h-python-lock
          path: /tmp/e0h-python-lock.json
          if-no-files-found: error
          retention-days: 1
