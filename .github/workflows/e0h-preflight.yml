name: E0-H Preflight

on:
  pull_request:
    paths:
      - ".github/workflows/e0h-preflight.yml"
      - "data/seed/v0.1/**"
      - "experiments/e0h/v1/**"
      - "tests/test_empirical_e0h_concrete_run_package.py"

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: pytorch/pytorch@sha256:0a3b9fedefe1f61ac4d5a9de9015c0863db27ca0fde2d4e37e6268147980b726
    env:
      PIP_CACHE_DIR: /tmp/e0h-pip-cache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Record base environment
        run: |
          python --version
          python -c "import platform, torch; print(platform.machine()); print(torch.__version__); print(torch.version.cuda)"

      - name: Install frozen preparation dependencies
        run: |
          python -m pip install --no-cache-dir --no-deps \
            -r experiments/e0h/v1/container/requirements.lock
          python -m pip check > /tmp/e0h-pip-check.txt 2>&1 || true
          cat /tmp/e0h-pip-check.txt
          sed '/^ninja 1\.11\.1\.1 is not supported on this platform$/d' \
            /tmp/e0h-pip-check.txt > /tmp/e0h-unexpected-pip-check.txt
          test ! -s /tmp/e0h-unexpected-pip-check.txt

      - name: Execute frozen preparation
        run: |
          python experiments/e0h/v1/preflight.py \
            --inputs experiments/e0h/v1/run_inputs.json \
            --cache-dir /tmp/e0h-hf-cache \
            --output-dir /tmp/e0h-preflight

      - name: Require exact committed receipts
        run: |
          diff -ru experiments/e0h/v1/preflight_receipts /tmp/e0h-preflight

      - name: Display canonical receipts
        run: |
          find /tmp/e0h-preflight -maxdepth 1 -type f -print -exec cat {} \;

      - name: Retain preflight receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e0h-preflight-receipts
          path: /tmp/e0h-preflight
          if-no-files-found: error
          retention-days: 30
