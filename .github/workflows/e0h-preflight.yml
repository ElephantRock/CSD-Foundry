name: E0-H Preflight

on:
  pull_request:
    paths:
      - ".github/workflows/e0h-preflight.yml"
      - "data/seed/v0.1/**"
      - "experiments/e0h/v1/**"
      - "tests/test_empirical_e0h_concrete_run_package.py"

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: pytorch/pytorch@sha256:0a3b9fedefe1f61ac4d5a9de9015c0863db27ca0fde2d4e37e6268147980b726
    steps:
      - uses: actions/checkout@v4

      - name: Install frozen preparation dependencies
        run: |
          python -m pip install --no-cache-dir --no-deps \
            -r experiments/e0h/v1/container/requirements.lock
          python -m pip check

      - name: Execute frozen preparation
        run: |
          python experiments/e0h/v1/preflight.py \
            --inputs experiments/e0h/v1/run_inputs.json \
            --cache-dir /tmp/e0h-hf-cache \
            --output-dir /tmp/e0h-preflight

      - name: Display canonical receipts
        run: |
          find /tmp/e0h-preflight -maxdepth 1 -type f -print -exec cat {} \;

      - name: Retain preflight receipts
        uses: actions/upload-artifact@v4
        with:
          name: e0h-preflight-receipts
          path: /tmp/e0h-preflight
          if-no-files-found: error
          retention-days: 30
