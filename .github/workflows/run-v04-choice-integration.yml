name: Run v0.4 choice integration

on:
  pull_request:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Apply source and specification integration
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          source = Path('.github/workflows/patch-v04-choice-primitives.yml').read_text(
              encoding='utf-8'
          )
          scripts = re.findall(
              r"python - <<'PY'\n(.*?)\n\s+PY",
              source,
              flags=re.DOTALL,
          )
          if len(scripts) != 2:
              raise SystemExit(f'expected two embedded Python scripts, found {len(scripts)}')

          prepared = []
          for script in scripts:
              prepared.append(
                  "\n".join(
                      line[10:] if line.startswith("          ") else line
                      for line in script.splitlines()
                  )
              )

          first = prepared[0]
          first = re.sub(
              r"\n\s*test_code = r'''(?:.|\n)*?test_path\.write_text\(test_code, encoding=\"utf-8\"\)\n",
              "\n",
              first,
          )
          first = re.sub(
              r"\n\s*replace\(\n\s*\"\.github/workflows/ci\.yml\",(?:.|\n)*?\n\s*\)\n",
              "\n",
              first,
          )
          if 'test_code = r' in first or '.github/workflows/ci.yml' in first:
              raise SystemExit('failed to remove runner-owned integration sections')

          exec(compile(first, 'source-integration', 'exec'), {})
          exec(compile(prepared[1], 'document-integration', 'exec'), {})
          PY
      - run: ruff format .
      - run: ruff check --fix .
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src
      - run: pytest
      - run: python scripts/validate_csd_reasoning_seed.py --directory data/seed/v0.1
      - run: python -m compileall -q src scripts tests
      - run: csd-foundry scenarios validate --release v0.1
      - run: csd-foundry mutations evaluate --release v0.1
      - run: csd-foundry temporal validate --release v0.3
      - run: csd-foundry temporal mutations --release v0.3
      - run: csd-foundry synthesize contracts --release v0.4
      - run: csd-foundry synthesize determinism --release v0.4 --output reports/determinism_v0.4.json
      - run: pip wheel . --no-deps --wheel-dir /tmp/csd-wheelhouse
      - name: Validate installed wheel outside repository
        run: |
          python -m venv /tmp/csd-installed
          /tmp/csd-installed/bin/pip install /tmp/csd-wheelhouse/csd_foundry-*.whl
          cd /tmp
          /tmp/csd-installed/bin/csd-foundry synthesize contracts --release v0.4 > contracts.json
          /tmp/csd-installed/bin/csd-foundry synthesize determinism --release v0.4 > determinism.json
          test -s contracts.json
          test -s determinism.json
      - name: Commit source integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs specs src tests data reports
          git commit -m "Integrate v0.4 deterministic choice primitives"
          git push
