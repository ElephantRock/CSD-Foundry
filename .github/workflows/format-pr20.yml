name: Format PR 20

on:
  push:
    branches:
      - web/19-execution-inventory-retry-v0.4

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: web/19-execution-inventory-retry-v0.4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install 'ruff>=0.9'
      - run: |
          ruff format \
            src/csd_foundry/synthesis/v0_4/execution_protocol.py \
            src/csd_foundry/synthesis/v0_4/execution_validation.py \
            tests/test_v0_4_execution_artifacts.py \
            tests/test_v0_4_execution_protocol.py
          rm .github/workflows/format-pr20.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Apply Ruff formatting to execution protocol' || exit 0
          git push origin HEAD:web/19-execution-inventory-retry-v0.4
