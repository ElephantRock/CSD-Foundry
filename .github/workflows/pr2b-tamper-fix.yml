name: PR 2B Tamper Harness Fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e '.[dev]'
      - name: Include fail-fast construction in tamper kill
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/csd_foundry/synthesis/v0_4/replay_validation.py")
          text = path.read_text(encoding="utf-8")
          old = '''    cases += 1
    first_record = accepted.choice_ledger.records[0]
    tampered_record: ChoiceRecord
    if type(first_record) is BoundedIntegerChoiceRecord:
        tampered_record = replace(first_record, upper_exclusive=first_record.upper_exclusive + 1)
    else:
        tampered_record = replace(first_record, schema_version="bad")
    try:
        tampered_ledger = replace(
            accepted.choice_ledger,
            records=(tampered_record, *accepted.choice_ledger.records[1:]),
        )
        replay_choice_ledger(_seed(), _namespace(), tampered_ledger)
    except (ReplayMismatchError, ValueError):
        rejected += 1
'''
          new = '''    cases += 1
    first_record = accepted.choice_ledger.records[0]
    try:
        tampered_record: ChoiceRecord
        if type(first_record) is BoundedIntegerChoiceRecord:
            tampered_record = replace(
                first_record,
                upper_exclusive=first_record.upper_exclusive + 1,
            )
        else:
            tampered_record = replace(first_record, schema_version="bad")
        tampered_ledger = replace(
            accepted.choice_ledger,
            records=(tampered_record, *accepted.choice_ledger.records[1:]),
        )
        replay_choice_ledger(_seed(), _namespace(), tampered_ledger)
    except (ReplayMismatchError, ValueError):
        rejected += 1
'''
          if old not in text:
              raise SystemExit("tamper block anchor not found")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
      - run: ruff format src/csd_foundry/synthesis/v0_4/replay_validation.py
      - run: ruff check src/csd_foundry/synthesis/v0_4/replay_validation.py
      - name: Commit fix
        run: |
          git config user.name "csd-foundry-ci"
          git config user.email "actions@users.noreply.github.com"
          git add src/csd_foundry/synthesis/v0_4/replay_validation.py
          git commit -m "Count fail-fast tamper rejection"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      - run: mypy src
      - run: pytest
      - run: csd-foundry synthesize replay --release v0.4
