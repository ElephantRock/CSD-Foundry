name: Apply issue 23 raced-directory sync

on:
  push:
    branches:
      - feature/23-append-only-publication
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/23-append-only-publication
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply raced-directory synchronization
        run: python scripts/apply_issue_23_raced_directory_sync.py
      - name: Remove one-shot patch
        run: rm scripts/apply_issue_23_raced_directory_sync.py
      - name: Install development environment
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Normalize modified Python
        run: |
          ruff format \
            src/csd_foundry/synthesis/v0_4/publication_store.py \
            tests/test_v0_4_publication_protocol.py
          ruff check --fix \
            src/csd_foundry/synthesis/v0_4/publication_store.py \
            tests/test_v0_4_publication_protocol.py
      - name: Run complete validation suite
        run: |
          ruff format --check .
          ruff check .
          mypy src
          pytest
          python scripts/validate_csd_reasoning_seed.py --directory data/seed/v0.1
          python -m compileall -q src scripts tests
          csd-foundry scenarios validate --release v0.1
          csd-foundry mutations evaluate --release v0.1
          csd-foundry temporal validate --release v0.3
          csd-foundry temporal mutations --release v0.3
          csd-foundry synthesize contracts --release v0.4
          csd-foundry synthesize determinism --release v0.4
          csd-foundry synthesize identities --release v0.4
          csd-foundry synthesize replay --release v0.4
          csd-foundry synthesize execution --release v0.4
          csd-foundry synthesize publication --release v0.4
          csd-foundry demo > /tmp/csd-foundry-demo.json
          test -s /tmp/csd-foundry-demo.json
          pip wheel . --no-deps --wheel-dir /tmp/csd-wheelhouse
          python -m venv /tmp/csd-installed
          /tmp/csd-installed/bin/pip install /tmp/csd-wheelhouse/csd_foundry-*.whl
          cd /tmp
          /tmp/csd-installed/bin/csd-foundry scenarios validate --release v0.1 > scenario-report.json
          /tmp/csd-installed/bin/csd-foundry temporal validate --release v0.3 > temporal-report.json
          /tmp/csd-installed/bin/csd-foundry temporal mutations --release v0.3 > mutation-report.json
          /tmp/csd-installed/bin/csd-foundry synthesize contracts --release v0.4 > contracts-report.json
          /tmp/csd-installed/bin/csd-foundry synthesize determinism --release v0.4 > determinism-report.json
          /tmp/csd-installed/bin/csd-foundry synthesize identities --release v0.4 > identities-report.json
          /tmp/csd-installed/bin/csd-foundry synthesize replay --release v0.4 > replay-report.json
          /tmp/csd-installed/bin/csd-foundry synthesize execution --release v0.4 > execution-report.json
          /tmp/csd-installed/bin/csd-foundry synthesize publication --release v0.4 > publication-report.json
          test -s scenario-report.json
          test -s temporal-report.json
          test -s mutation-report.json
          test -s contracts-report.json
          test -s determinism-report.json
          test -s identities-report.json
          test -s replay-report.json
          test -s execution-report.json
          test -s publication-report.json
      - name: Commit validated durability fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Sync raced publication directory parents (#23)"
          git push origin HEAD:feature/23-append-only-publication
