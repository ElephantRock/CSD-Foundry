name: E0-H Windows Native Qualification

on:
  pull_request:
    paths:
      - ".github/workflows/e0h-windows-native.yml"
      - "experiments/e0h/windows_native_v1/**"
      - "src/csd_foundry/empirical/e0h/windows_native.py"
      - "tests/test_e0h_windows_native_release.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/e0h-windows-native.yml"
      - "experiments/e0h/windows_native_v1/**"
      - "src/csd_foundry/empirical/e0h/windows_native.py"
      - "tests/test_e0h_windows_native_release.py"

permissions:
  contents: read

jobs:
  qualification:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest tests/test_e0h_windows_native_release.py
      - name: Validate exact compiled release
        shell: pwsh
        run: >-
          python experiments/e0h/windows_native_v1/compile_release.py
          --inputs experiments/e0h/windows_native_v1/run_inputs.json
          --dependency-lock experiments/e0h/windows_native_v1/dependency_lock.json
          --output-dir experiments/e0h/windows_native_v1/compiled_release
          --validate
      - run: python -m compileall -q src experiments/e0h/windows_native_v1 tests
