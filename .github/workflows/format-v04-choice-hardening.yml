name: Format v0.4 choice hardening

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: |
          ruff format \
            src/csd_foundry/synthesis/v0_4/choice_paths.py \
            src/csd_foundry/synthesis/v0_4/choice_policy.py \
            tests/synthesis_v0_4/test_deterministic_choices.py
          ruff check --fix \
            src/csd_foundry/synthesis/v0_4/choice_paths.py \
            src/csd_foundry/synthesis/v0_4/choice_policy.py \
            tests/synthesis_v0_4/test_deterministic_choices.py
          ruff format --check \
            src/csd_foundry/synthesis/v0_4/choice_paths.py \
            src/csd_foundry/synthesis/v0_4/choice_policy.py \
            tests/synthesis_v0_4/test_deterministic_choices.py
          ruff check \
            src/csd_foundry/synthesis/v0_4/choice_paths.py \
            src/csd_foundry/synthesis/v0_4/choice_policy.py \
            tests/synthesis_v0_4/test_deterministic_choices.py
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/csd_foundry/synthesis/v0_4/choice_paths.py \
            src/csd_foundry/synthesis/v0_4/choice_policy.py \
            tests/synthesis_v0_4/test_deterministic_choices.py
          git diff --cached --quiet || git commit -m "Format deterministic choice hardening"
          git push
