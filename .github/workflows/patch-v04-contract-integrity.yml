name: Patch v0.4 contract integrity

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: web/10-synthesis-contracts-v0.4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Bind synthesis contracts to executable invariants and schema versions
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          path = Path("src/csd_foundry/kernel/invariants.py")
          text = path.read_text()
          text = text.replace(
              "from csd_foundry.kernel.events import CsdEvent, DependencyChange, Reassess, RetireControl\n",
              "from csd_foundry.kernel.events import CsdEvent, DependencyChange, Reassess, RetireControl\n"
              "from csd_foundry.kernel.invariant_registry import EXECUTABLE_INVARIANT_IDS\n",
              1,
          )
          text = text.replace(
              '''@dataclass(frozen=True, slots=True)
          class Violation:
              invariant_id: str
              message: str
          ''',
              '''@dataclass(frozen=True, slots=True)
          class Violation:
              invariant_id: str
              message: str

              def __post_init__(self) -> None:
                  if self.invariant_id not in EXECUTABLE_INVARIANT_IDS:
                      raise ValueError(f"unregistered executable invariant: {self.invariant_id}")
          ''',
              1,
          )
          path.write_text(text)

          path = Path("src/csd_foundry/synthesis/v0_4/contracts.py")
          text = path.read_text()
          text = text.replace(
              "from enum import StrEnum\n",
              "from enum import StrEnum\n\n"
              "from csd_foundry.kernel.invariant_registry import EXECUTABLE_INVARIANT_IDS\n",
              1,
          )
          text = text.replace(
              '''        _require_unique(self.omitted_dimensions, "omitted_dimensions")
              _require_text(self.justification, "justification")
              if self.evidence_kind is CompletenessEvidenceKind.FULLY_BOUNDED:
          ''',
              '''        _require_unique(self.omitted_dimensions, "omitted_dimensions")
              _require_text(self.justification, "justification")
              if self.bounded_projection_id is not None:
                  _require_text(self.bounded_projection_id, "bounded_projection_id")
              if self.alternative_witness_id is not None:
                  _require_text(self.alternative_witness_id, "alternative_witness_id")
              if self.evidence_kind is CompletenessEvidenceKind.FULLY_BOUNDED:
          ''',
              1,
          )
          text = text.replace(
              '''        if not self.required_invariants:
                  raise ContractValidationError("required_invariants must be nonempty")
              if not self.required_consequences:
          ''',
              '''        if not self.required_invariants:
                  raise ContractValidationError("required_invariants must be nonempty")
              unknown_invariants = self.required_invariants - EXECUTABLE_INVARIANT_IDS
              if unknown_invariants:
                  raise ContractValidationError(
                      "required_invariants are not executable: "
                      f"{sorted(unknown_invariants)}"
                  )
              if not self.required_consequences:
          ''',
              1,
          )
          path.write_text(text)

          path = Path("src/csd_foundry/synthesis/v0_4/validation.py")
          text = path.read_text()
          marker = '''def _search_budget(data: dict[str, object]) -> SearchBudget:
          '''
          helper = '''def _require_document_header(
              data: dict[str, object], document_name: str
          ) -> None:
              if _string(data, "release") != "v0.4":
                  raise ContractValidationError(f"{document_name} release must be v0.4")
              if _string(data, "schema_version") != "0.4.0":
                  raise ContractValidationError(
                      f"{document_name} schema_version must be 0.4.0"
                  )


          def _search_budget(data: dict[str, object]) -> SearchBudget:
          '''
          if marker not in text:
              raise SystemExit("search budget marker not found")
          text = text.replace(marker, helper, 1)
          text = text.replace(
              '''    document = _mapping(COVERAGE_TARGETS_SPEC, "coverage target document")
              if _string(document, "release") != "v0.4":
                  raise ContractValidationError("coverage target release must be v0.4")
          ''',
              '''    document = _mapping(COVERAGE_TARGETS_SPEC, "coverage target document")
              _require_document_header(document, "coverage target document")
          ''',
              1,
          )
          text = text.replace(
              '''    document = _mapping(HOLDOUTS_SPEC, "holdout document")
              rules: list[HoldoutRule] = []
          ''',
              '''    document = _mapping(HOLDOUTS_SPEC, "holdout document")
              _require_document_header(document, "holdout document")
              rules: list[HoldoutRule] = []
          ''',
              1,
          )
          text = text.replace(
              '''def load_release_policy() -> ReleasePolicy:
              data = _mapping(RELEASE_POLICY_SPEC, "release policy")
              return ReleasePolicy(
          ''',
              '''def load_release_policy() -> ReleasePolicy:
              data = _mapping(RELEASE_POLICY_SPEC, "release policy")
              _require_document_header(data, "release policy")
              return ReleasePolicy(
          ''',
              1,
          )
          text = text.replace(
              '''def load_performance_policy() -> PerformancePolicy:
              data = _mapping(PERFORMANCE_POLICY_SPEC, "performance policy")
              environment: list[tuple[str, str]] = []
          ''',
              '''def load_performance_policy() -> PerformancePolicy:
              data = _mapping(PERFORMANCE_POLICY_SPEC, "performance policy")
              _require_document_header(data, "performance policy")
              environment: list[tuple[str, str]] = []
          ''',
              1,
          )
          text = text.replace(
              '''def load_mutation_risk_policy() -> MutationRiskPolicy:
              data = _mapping(MUTATION_RISK_POLICY_SPEC, "mutation risk policy")
              budgets: list[MutationRiskBudget] = []
          ''',
              '''def load_mutation_risk_policy() -> MutationRiskPolicy:
              data = _mapping(MUTATION_RISK_POLICY_SPEC, "mutation risk policy")
              _require_document_header(data, "mutation risk policy")
              budgets: list[MutationRiskBudget] = []
          ''',
              1,
          )
          text = text.replace(
              '''def load_deterministic_arithmetic_policy() -> DeterministicArithmeticPolicy:
              data = _mapping(DETERMINISTIC_ARITHMETIC_POLICY_SPEC, "deterministic arithmetic policy")
              return DeterministicArithmeticPolicy(
          ''',
              '''def load_deterministic_arithmetic_policy() -> DeterministicArithmeticPolicy:
              data = _mapping(DETERMINISTIC_ARITHMETIC_POLICY_SPEC, "deterministic arithmetic policy")
              _require_document_header(data, "deterministic arithmetic policy")
              return DeterministicArithmeticPolicy(
          ''',
              1,
          )
          text = text.replace(
              '''            release_policy = load_release_policy()
                  risk_policy = load_mutation_risk_policy()
                  load_deterministic_arithmetic_policy()
          ''',
              '''            release_policy = load_release_policy()
                  performance_policy = load_performance_policy()
                  risk_policy = load_mutation_risk_policy()
                  load_deterministic_arithmetic_policy()
          ''',
              1,
          )
          path.write_text(text)

          path = Path("specs/v0.4/coverage_targets.schema.json")
          schema = json.loads(path.read_text())
          item = schema["properties"]["targets"]["items"]
          completeness = item["properties"]["completeness"]
          optional_nonempty = {
              "anyOf": [
                  {"minLength": 1, "type": "string"},
                  {"type": "null"},
              ]
          }
          completeness["properties"]["bounded_projection_id"] = optional_nonempty
          completeness["properties"]["alternative_witness_id"] = optional_nonempty
          completeness["allOf"] = [
              {
                  "if": {
                      "properties": {"evidence_kind": {"const": "fully_bounded"}},
                      "required": ["evidence_kind"],
                  },
                  "then": {
                      "properties": {
                          "bounded_projection_id": {"minLength": 1, "type": "string"},
                          "alternative_witness_id": {"type": "null"},
                          "omitted_dimensions": {"maxItems": 0},
                      }
                  },
              },
              {
                  "if": {
                      "properties": {"evidence_kind": {"const": "projected_bounded"}},
                      "required": ["evidence_kind"],
                  },
                  "then": {
                      "properties": {
                          "bounded_projection_id": {"minLength": 1, "type": "string"},
                          "omitted_dimensions": {"minItems": 1},
                      }
                  },
              },
              {
                  "if": {
                      "properties": {"evidence_kind": {"const": "alternative_assurance"}},
                      "required": ["evidence_kind"],
                  },
                  "then": {
                      "properties": {
                          "alternative_witness_id": {"minLength": 1, "type": "string"}
                      }
                  },
              },
          ]
          executable_ids = [
              "G-INV-06",
              "G-INV-10",
              "G-INV-11",
              "G-INV-13",
              "H-INV-01",
              "H-INV-02",
              "H-INV-03",
              "INV-04",
              "INV-05",
              "INV-07",
              "INV-11",
              "INV-13",
              "INV-14",
              "INV-15",
              "INV-16",
              "INV-18",
              "INV-19",
              "P-INV-01",
              "P-INV-02",
              "P-INV-03",
              "P-INV-04",
              "R-INV-01",
              "R-INV-02",
              "R-INV-03",
              "R-INV-04",
              "T-INV-01",
              "T-INV-02",
              "T-INV-03",
              "T-INV-04",
              "T-INV-06",
          ]
          item["properties"]["required_invariants"]["items"]["enum"] = executable_ids
          path.write_text(json.dumps(schema, indent=2, sort_keys=True) + "\n")

          path = Path("tests/synthesis_v0_4/test_contracts.py")
          text = path.read_text()
          text = text.replace(
              "import pytest\n\n",
              "import pytest\n\n"
              "from csd_foundry.kernel.invariant_registry import EXECUTABLE_INVARIANT_IDS\n"
              "from csd_foundry.kernel.invariants import Violation\n"
              "from csd_foundry.synthesis.v0_4 import validation as synthesis_validation\n",
              1,
          )
          text += '''

          def test_required_invariants_must_be_executable() -> None:
              with pytest.raises(ContractValidationError):
                  CoverageTarget(
                      target_id="unknown-invariant",
                      disposition=TargetDisposition.REQUIRED,
                      topology_pattern="single",
                      event_pattern=("AdvanceClock",),
                      temporal_pattern="boundary",
                      request_pattern="none",
                      profile_pattern="stable",
                      required_invariants=frozenset({"T-INV-99"}),
                      required_consequences=frozenset({"time-advances"}),
                      minimum_count=1,
                      rarity_weight=1,
                      holdout_tags=frozenset(),
                      search_budget=_budget(),
                      completeness=_completeness("unknown-invariant"),
                  )
              with pytest.raises(ValueError):
                  Violation("T-INV-99", "not executable")
              assert all(
                  target.required_invariants <= EXECUTABLE_INVARIANT_IDS
                  for target in load_targets()
              )


          @pytest.mark.parametrize(
              ("kind", "bounded_id", "alternative_id"),
              [
                  (CompletenessEvidenceKind.FULLY_BOUNDED, "", None),
                  (CompletenessEvidenceKind.PROJECTED_BOUNDED, "", "alternative"),
                  (CompletenessEvidenceKind.ALTERNATIVE_ASSURANCE, None, ""),
              ],
          )
          def test_completeness_witness_identifiers_must_be_nonempty(
              kind: CompletenessEvidenceKind,
              bounded_id: str | None,
              alternative_id: str | None,
          ) -> None:
              omitted = () if kind is CompletenessEvidenceKind.FULLY_BOUNDED else ("scale",)
              with pytest.raises(ContractValidationError):
                  CompletenessWitnessMap(
                      target_id="target",
                      evidence_kind=kind,
                      bounded_projection_id=bounded_id,
                      omitted_dimensions=omitted,
                      justification="test witness",
                      alternative_witness_id=alternative_id,
                  )


          def test_packaged_loader_rejects_schema_version_mismatch(
              monkeypatch: pytest.MonkeyPatch,
          ) -> None:
              mismatched = dict(synthesis_validation.COVERAGE_TARGETS_SPEC)
              mismatched["schema_version"] = "0.4.1"
              monkeypatch.setattr(
                  synthesis_validation,
                  "COVERAGE_TARGETS_SPEC",
                  mismatched,
              )
              with pytest.raises(ContractValidationError):
                  synthesis_validation.load_targets()
          '''
          path.write_text(text)
          PY
      - run: ruff format .
      - run: ruff check --fix .
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src
      - run: pytest
      - run: csd-foundry synthesize contracts --release v0.4
      - name: Commit contract integrity corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Bind synthesis targets to executable contracts"
          git push origin HEAD:web/10-synthesis-contracts-v0.4
