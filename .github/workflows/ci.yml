name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: web/7-temporal-governance-kernel-v0.3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Harden audit and preservation verification
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/csd_foundry/kernel/temporal_invariants.py")
          text = path.read_text()
          text = text.replace(
              "    Assurance,\n    Basis,\n",
              "    Assurance,\n    AuditEvent,\n    Basis,\n",
              1,
          )
          marker = "_SUBSTANTIVE = {Assurance.PASS, Assurance.PARTIAL, Assurance.FAIL}\n\n\n"
          helper = '''_SUBSTANTIVE = {Assurance.PASS, Assurance.PARTIAL, Assurance.FAIL}


          def _validate_exact_audit(
              before: ControlState,
              after: ControlState,
              expected: AuditEvent,
              invariant_id: str,
          ) -> list[Violation]:
              if after.history == (*before.history, expected):
                  return []
              return [Violation(invariant_id, f"{expected.event_type} audit append is not canonical")]


          '''
          if marker not in text:
              raise SystemExit("temporal helper insertion marker not found")
          text = text.replace(marker, helper, 1)

          old = '''    if set(after.evidence_by_id()) != set(before.evidence_by_id()):
                  violations.append(Violation("T-INV-02", "clock advance altered evidence identities"))

              after_evidence = after.evidence_by_id()
          '''
          new = '''    if set(after.evidence_by_id()) != set(before.evidence_by_id()):
                  violations.append(Violation("T-INV-02", "clock advance altered evidence identities"))
              if after.bases != before.bases:
                  violations.append(Violation("T-INV-03", "clock advance rewrote historical bases"))

              after_evidence = after.evidence_by_id()
          '''
          if old not in text:
              raise SystemExit("clock identity block not found")
          text = text.replace(old, new, 1)

          old = '''    if (
                  after.required_profile_id != before.required_profile_id
                  or after.required_profile_version != before.required_profile_version
                  or after.reassessment_requests != before.reassessment_requests
                  or after.heartbeat != before.heartbeat
              ):
                  violations.append(Violation("T-INV-01", "clock changed unrelated governance state"))
              return violations
          '''
          new = '''    if (
                  after.required_profile_id != before.required_profile_id
                  or after.required_profile_version != before.required_profile_version
                  or after.reassessment_requests != before.reassessment_requests
                  or after.heartbeat != before.heartbeat
              ):
                  violations.append(Violation("T-INV-01", "clock changed unrelated governance state"))
              expired_ids = {
                  item.evidence_id
                  for item in before.evidence
                  if item.status is EvidenceStatus.CURRENT
                  and item.expires_at is not None
                  and item.expires_at <= event.target_time
              }
              expected_audit = AuditEvent.create(
                  "AdvanceClock",
                  from_time=str(before.logical_time),
                  target_time=str(event.target_time),
                  expired_evidence=",".join(sorted(expired_ids)),
                  heartbeat_missed=str(heartbeat_missed).lower(),
              )
              violations.extend(
                  _validate_exact_audit(before, after, expected_audit, "T-INV-04")
              )
              return violations
          '''
          if old not in text:
              raise SystemExit("clock return block not found")
          text = text.replace(old, new, 1)

          old = '''    if after.heartbeat != before.heartbeat:
                  violations.append(Violation("H-INV-01", "profile change altered heartbeat state"))
              return violations


          def _validate_request(
          '''
          new = '''    if after.heartbeat != before.heartbeat:
                  violations.append(Violation("H-INV-01", "profile change altered heartbeat state"))
              incompatible_ids = {
                  item.evidence_id
                  for item in before.evidence
                  if item.status is EvidenceStatus.CURRENT
                  and item.profile_id is not None
                  and (
                      item.profile_id != event.profile_id
                      or item.profile_version != event.profile_version
                  )
              }
              expected_audit = AuditEvent.create(
                  "ProfileChange",
                  authority=event.authority,
                  profile_id=event.profile_id,
                  profile_version=str(event.profile_version),
                  profile_incompatible_evidence=",".join(sorted(incompatible_ids)),
                  request_id=event.request_id or "none",
              )
              violations.extend(
                  _validate_exact_audit(before, after, expected_audit, "P-INV-04")
              )
              return violations


          def _validate_request(
          '''
          if old not in text:
              raise SystemExit("profile audit insertion point not found")
          text = text.replace(old, new, 1)

          old = '''    new_ids = set(after.requests_by_id()) - set(before.requests_by_id())
              if new_ids != {event.request_id} or after.requests_by_id().get(event.request_id) != expected:
                  violations.append(Violation("R-INV-01", "request result does not match the event"))
              return violations
          '''
          new = '''    before_requests = before.requests_by_id()
              after_requests = after.requests_by_id()
              new_ids = set(after_requests) - set(before_requests)
              if new_ids != {event.request_id} or after_requests.get(event.request_id) != expected:
                  violations.append(Violation("R-INV-01", "request result does not match the event"))
              for request_id, existing_request in before_requests.items():
                  if after_requests.get(request_id) != existing_request:
                      violations.append(
                          Violation(
                              "R-INV-01",
                              f"request creation rewrote existing request {request_id}",
                          )
                      )
              expected_audit = AuditEvent.create(
                  "RequestReassessment",
                  authority=event.authority,
                  request_id=event.request_id,
                  due_at=str(event.due_at),
                  reason=event.reason,
              )
              violations.extend(
                  _validate_exact_audit(before, after, expected_audit, "R-INV-04")
              )
              return violations
          '''
          if old not in text:
              raise SystemExit("request preservation block not found")
          text = text.replace(old, new, 1)

          old = '''    if (
                  interval is None
                  or after.heartbeat is None
                  or after.heartbeat.interval != interval
                  or after.heartbeat.last_recorded_at != event.at_time
                  or after.heartbeat.due_at != event.at_time + interval
              ):
                  violations.append(Violation("H-INV-01", "heartbeat result does not match the event"))
              return violations
          '''
          new = '''    if (
                  interval is None
                  or after.heartbeat is None
                  or after.heartbeat.interval != interval
                  or after.heartbeat.last_recorded_at != event.at_time
                  or after.heartbeat.due_at != event.at_time + interval
              ):
                  violations.append(Violation("H-INV-01", "heartbeat result does not match the event"))
              if interval is not None:
                  expected_audit = AuditEvent.create(
                      "RecordHeartbeat",
                      authority=event.authority,
                      at_time=str(event.at_time),
                      interval=str(interval),
                      due_at=str(event.at_time + interval),
                  )
                  violations.extend(
                      _validate_exact_audit(before, after, expected_audit, "H-INV-03")
                  )
              return violations
          '''
          if old not in text:
              raise SystemExit("heartbeat audit block not found")
          text = text.replace(old, new, 1)

          old = '''    if isinstance(event, Reassess):
                  return tuple(
                      [
                          *_unchanged_temporal_governance(before, after, allow_requests=True),
                          *_validate_reassessment_requests(before, event, after),
                      ]
                  )
          '''
          new = '''    if isinstance(event, Reassess):
                  violations = [
                      *_unchanged_temporal_governance(before, after, allow_requests=True),
                      *_validate_reassessment_requests(before, event, after),
                  ]
                  audit_details = {
                      "authority": event.authority,
                      "evidence_ids": ",".join(
                          sorted(item.evidence_id for item in event.new_evidence)
                      ),
                      "basis_ids": ",".join(
                          sorted(item.basis_id for item in event.new_bases)
                      ),
                  }
                  if event.close_request_ids:
                      audit_details["closed_request_ids"] = ",".join(
                          sorted(event.close_request_ids)
                      )
                  expected_audit = AuditEvent.create("Reassess", **audit_details)
                  violations.extend(
                      _validate_exact_audit(before, after, expected_audit, "R-INV-04")
                  )
                  return tuple(violations)
          '''
          if old not in text:
              raise SystemExit("reassessment event audit block not found")
          text = text.replace(old, new, 1)
          path.write_text(text)

          path = Path("src/csd_foundry/synthesis/temporal_mutations.py")
          text = path.read_text()
          text = text.replace(
              "    Assurance,\n    ControlState,\n",
              "    Assurance,\n    Basis,\n    BasisKind,\n    ControlState,\n",
              1,
          )
          text = text.replace(
              "    HeartbeatState,\n)",
              "    HeartbeatState,\n    RequestStatus,\n)",
              1,
          )

          old = '''    expiry_after = oracle.apply(expiry_before, expiry_event).after

              early_event = AdvanceClock(4)
          '''
          new = '''    expiry_after = oracle.apply(expiry_before, expiry_event).after
              manufactured_clock_basis = Basis(
                  "BASIS-CLOCK-MANUFACTURED",
                  BasisKind.SOURCE,
                  "connected",
                  frozenset({"EV-SOURCE"}),
              )

              early_event = AdvanceClock(4)
          '''
          if old not in text:
              raise SystemExit("clock mutation setup point not found")
          text = text.replace(old, new, 1)

          old = '''    request_event = RequestReassessment("REQ-MUT", "mutation control", due_at=8)
              request_after = oracle.apply(stale, request_event).after
              unauthorized_request_event = replace(request_event, authority="I2")

              heartbeat_event = RecordHeartbeat(at_time=0, interval=5)
          '''
          new = '''    request_event = RequestReassessment("REQ-MUT", "mutation control", due_at=8)
              request_after = oracle.apply(stale, request_event).after
              unauthorized_request_event = replace(request_event, authority="I2")
              existing_request_state = oracle.apply(
                  base_state(),
                  RequestReassessment("REQ-EXISTING", "existing work", due_at=7),
              ).after
              second_request_event = RequestReassessment(
                  "REQ-SECOND",
                  "second work",
                  due_at=8,
              )
              second_request_after = oracle.apply(
                  existing_request_state,
                  second_request_event,
              ).after
              silently_closed_existing = replace(
                  existing_request_state.reassessment_requests[0],
                  status=RequestStatus.CLOSED,
                  closed_at=existing_request_state.logical_time,
              )

              heartbeat_event = RecordHeartbeat(at_time=0, interval=5)
          '''
          if old not in text:
              raise SystemExit("request preservation mutation setup not found")
          text = text.replace(old, new, 1)

          marker = '''        TemporalMutationProbe(
                      "mut-temporal-expire-early",
          '''
          insertion = '''        TemporalMutationProbe(
                      "mut-clock-manufacture-basis",
                      expiry_before,
                      expiry_event,
                      replace(
                          expiry_after,
                          bases=(*expiry_after.bases, manufactured_clock_basis),
                      ),
                      frozenset({"T-INV-03"}),
                  ),
                  TemporalMutationProbe(
                      "mut-clock-omit-audit",
                      expiry_before,
                      expiry_event,
                      replace(expiry_after, history=expiry_before.history),
                      frozenset({"T-INV-04"}),
                  ),
          '''
          if marker not in text:
              raise SystemExit("clock mutations insertion point not found")
          text = text.replace(marker, insertion + marker, 1)

          marker = '''        TemporalMutationProbe(
                      "mut-profile-unauthorized-authority",
          '''
          insertion = '''        TemporalMutationProbe(
                      "mut-profile-omit-audit",
                      profile_before,
                      profile_event,
                      replace(profile_after, history=profile_before.history),
                      frozenset({"P-INV-04"}),
                  ),
          '''
          if marker not in text:
              raise SystemExit("profile audit mutation insertion point not found")
          text = text.replace(marker, insertion + marker, 1)

          marker = '''        TemporalMutationProbe(
                      "mut-request-promote-verdict",
          '''
          insertion = '''        TemporalMutationProbe(
                      "mut-request-rewrite-existing-request",
                      existing_request_state,
                      second_request_event,
                      replace(
                          second_request_after,
                          reassessment_requests=(
                              silently_closed_existing,
                              second_request_after.reassessment_requests[1],
                          ),
                      ),
                      frozenset({"R-INV-01"}),
                  ),
                  TemporalMutationProbe(
                      "mut-request-omit-audit",
                      stale,
                      request_event,
                      replace(request_after, history=stale.history),
                      frozenset({"R-INV-04"}),
                  ),
          '''
          if marker not in text:
              raise SystemExit("request mutations insertion point not found")
          text = text.replace(marker, insertion + marker, 1)

          marker = '''        TemporalMutationProbe(
                      "mut-heartbeat-promote-verdict",
          '''
          insertion = '''        TemporalMutationProbe(
                      "mut-heartbeat-omit-audit",
                      stale,
                      heartbeat_event,
                      replace(heartbeat_after, history=stale.history),
                      frozenset({"H-INV-03"}),
                  ),
          '''
          if marker not in text:
              raise SystemExit("heartbeat audit mutation insertion point not found")
          text = text.replace(marker, insertion + marker, 1)

          marker = '''        TemporalMutationProbe(
                      "mut-reassessment-omit-request-closure",
          '''
          insertion = '''        TemporalMutationProbe(
                      "mut-reassessment-omit-audit",
                      requested,
                      close_event,
                      replace(close_after, history=requested.history),
                      frozenset({"R-INV-04"}),
                  ),
          '''
          if marker not in text:
              raise SystemExit("reassessment audit mutation insertion point not found")
          text = text.replace(marker, insertion + marker, 1)
          path.write_text(text)

          path = Path("tests/test_temporal_kernel.py")
          text = path.read_text().replace(
              "    assert report.total == 16\n    assert report.killed == 16",
              "    assert report.total == 23\n    assert report.killed == 23",
              1,
          )
          path.write_text(text)
          PY
      - run: ruff format .
      - run: ruff check --fix .
      - name: Commit complete temporal audit verification
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Verify temporal audit and state preservation"
          git push origin HEAD:web/7-temporal-governance-kernel-v0.3
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src
      - run: pytest
      - run: python scripts/validate_csd_reasoning_seed.py --directory data/seed/v0.1
      - run: python -m compileall -q src scripts tests
      - run: csd-foundry scenarios validate --release v0.1
      - run: csd-foundry mutations evaluate --release v0.1
      - run: csd-foundry temporal validate --release v0.3
      - run: csd-foundry temporal mutations --release v0.3
      - run: csd-foundry demo > /tmp/csd-foundry-demo.json && test -s /tmp/csd-foundry-demo.json
      - run: pip wheel . --no-deps --wheel-dir /tmp/csd-wheelhouse
      - name: Validate installed wheel outside the repository
        run: |
          python -m venv /tmp/csd-installed
          /tmp/csd-installed/bin/pip install /tmp/csd-wheelhouse/csd_foundry-*.whl
          cd /tmp
          /tmp/csd-installed/bin/csd-foundry scenarios validate --release v0.1 > scenario-report.json
          /tmp/csd-installed/bin/csd-foundry temporal validate --release v0.3 > temporal-report.json
          /tmp/csd-installed/bin/csd-foundry temporal mutations --release v0.3 > mutation-report.json
          test -s scenario-report.json
          test -s temporal-report.json
          test -s mutation-report.json
