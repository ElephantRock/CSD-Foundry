name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  final-review-fix:
    if: github.actor != 'github-actions[bot]' && github.event_name == 'pull_request' && github.head_ref == 'web/19-execution-inventory-retry-v0.4'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: web/19-execution-inventory-retry-v0.4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install 'ruff>=0.9'
      - name: Apply final reviewed protocol corrections
        run: |
          python scripts/fix_pr20_final_review.py
          ruff format \
            src/csd_foundry/synthesis/v0_4/execution_protocol.py \
            src/csd_foundry/synthesis/v0_4/execution_validation.py \
            tests/test_v0_4_execution_protocol.py \
            tests/test_v0_4_execution_exact_types.py \
            tests/test_v0_4_execution_review_regressions.py \
            tests/test_v0_4_execution_artifacts.py
          rm scripts/fix_pr20_final_review.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Address final execution protocol review'
          git push origin HEAD:web/19-execution-inventory-retry-v0.4

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src
      - run: pytest
      - run: python scripts/validate_csd_reasoning_seed.py --directory data/seed/v0.1
      - run: python -m compileall -q src scripts tests
      - run: csd-foundry scenarios validate --release v0.1
      - run: csd-foundry mutations evaluate --release v0.1
      - run: csd-foundry temporal validate --release v0.3
      - run: csd-foundry temporal mutations --release v0.3
      - run: csd-foundry synthesize contracts --release v0.4
      - run: csd-foundry synthesize determinism --release v0.4
      - run: csd-foundry synthesize identities --release v0.4
      - run: csd-foundry synthesize replay --release v0.4
      - run: csd-foundry synthesize execution --release v0.4
      - run: csd-foundry demo > /tmp/csd-foundry-demo.json && test -s /tmp/csd-foundry-demo.json
      - run: pip wheel . --no-deps --wheel-dir /tmp/csd-wheelhouse
      - name: Validate installed wheel outside the repository
        run: |
          python -m venv /tmp/csd-installed
          /tmp/csd-installed/bin/pip install /tmp/csd-wheelhouse/csd_foundry-*.whl
          cd /tmp
          /tmp/csd-installed/bin/csd-foundry scenarios validate --release v0.1 > scenario-report.json
          /tmp/csd-installed/bin/csd-foundry temporal validate --release v0.3 > temporal-report.json
          /tmp/csd-installed/bin/csd-foundry temporal mutations --release v0.3 > mutation-report.json
          /tmp/csd-installed/bin/csd-foundry synthesize contracts --release v0.4 > contracts-report.json
          /tmp/csd-installed/bin/csd-foundry synthesize determinism --release v0.4 > determinism-report.json
          /tmp/csd-installed/bin/csd-foundry synthesize identities --release v0.4 > identities-report.json
          /tmp/csd-installed/bin/csd-foundry synthesize replay --release v0.4 > replay-report.json
          /tmp/csd-installed/bin/csd-foundry synthesize execution --release v0.4 > execution-report.json
          test -s scenario-report.json
          test -s temporal-report.json
          test -s mutation-report.json
          test -s contracts-report.json
          test -s determinism-report.json
          test -s identities-report.json
          test -s replay-report.json
          test -s execution-report.json
