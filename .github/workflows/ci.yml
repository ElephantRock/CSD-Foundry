name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: web/7-temporal-governance-kernel-v0.3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Apply profile and legacy compatibility semantics
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_function(text: str, start: str, end: str, replacement: str) -> str:
              start_index = text.index(start)
              end_index = text.index(end, start_index)
              return text[:start_index] + replacement + "\n\n" + text[end_index:]

          path = Path("src/csd_foundry/kernel/temporal.py")
          text = path.read_text()
          helper = '''def _evidence_matches_required_profile(state: ControlState, evidence_id: str) -> bool:
              item = state.evidence_by_id().get(evidence_id)
              if item is None:
                  return False
              if state.required_profile_id is None or item.profile_id is None:
                  return True
              return (
                  item.profile_id == state.required_profile_id
                  and item.profile_version == state.required_profile_version
              )


          def _basis_is_current(state: ControlState, basis_id: str) -> bool:
              evidence = state.evidence_by_id()
              basis = state.bases_by_id().get(basis_id)
              if basis is None or not basis.approved or not basis.member_evidence_ids:
                  return False
              return all(
                  member in evidence
                  and evidence[member].status is EvidenceStatus.CURRENT
                  and _evidence_matches_required_profile(state, member)
                  for member in basis.member_evidence_ids
              )
          '''
          text = replace_function(
              text,
              "def _basis_is_current",
              "def _surviving_bases",
              helper,
          )

          profile_function = '''def apply_profile_change(
              state: ControlState, event: ProfileChange
          ) -> tuple[ControlState, TransitionTrace]:
              if event.authority != "I3":
                  raise TemporalTransitionError("profile change requires I3 authority")
              if not event.profile_id or event.profile_version <= 0:
                  raise TemporalTransitionError("profile identity and positive version are required")
              if (
                  state.required_profile_id == event.profile_id
                  and state.required_profile_version is not None
                  and event.profile_version <= state.required_profile_version
              ):
                  raise TemporalTransitionError("profile version must advance monotonically")
              if (event.request_id is None) != (event.request_due_at is None):
                  raise TemporalTransitionError(
                      "profile request identity and due time must be supplied together"
                  )

              incompatible_ids = {
                  item.evidence_id
                  for item in state.evidence
                  if item.status is EvidenceStatus.CURRENT
                  and item.profile_id is not None
                  and (
                      item.profile_id != event.profile_id
                      or item.profile_version != event.profile_version
                  )
              }

              requests = state.reassessment_requests
              if event.request_id is not None and event.request_due_at is not None:
                  if event.request_id in state.requests_by_id():
                      raise TemporalTransitionError("profile change request identity already exists")
                  request = _request_from_event(
                      RequestReassessment(
                          request_id=event.request_id,
                          reason="required profile changed",
                          due_at=event.request_due_at,
                          authority=event.authority,
                      ),
                      state.logical_time,
                  )
                  requests = (*requests, request)

              interim = replace(
                  state,
                  required_profile_id=event.profile_id,
                  required_profile_version=event.profile_version,
                  reassessment_requests=requests,
              )
              source, assurance, source_bases, verdict_bases = _canonical_claims(state, interim)
              removed = (
                  (state.current_source_basis_ids | state.current_verdict_basis_ids)
                  - source_bases
                  - verdict_bases
              )
              post = replace(
                  interim,
                  source_state=source,
                  assurance=assurance,
                  current_source_basis_ids=source_bases,
                  current_verdict_basis_ids=verdict_bases,
                  history=(
                      *state.history,
                      AuditEvent.create(
                          "ProfileChange",
                          authority=event.authority,
                          profile_id=event.profile_id,
                          profile_version=str(event.profile_version),
                          profile_incompatible_evidence=",".join(sorted(incompatible_ids)),
                          request_id=event.request_id or "none",
                      ),
                  ),
              )
              trace = TransitionTrace(
                  event_type="ProfileChange",
                  preserved_evidence=tuple(
                      sorted(
                          item.evidence_id
                          for item in post.evidence
                          if item.status is EvidenceStatus.CURRENT
                      )
                  ),
                  removed_bases=tuple(sorted(removed)),
                  surviving_bases=tuple(sorted(source_bases | verdict_bases)),
                  previous_source_state=state.source_state.value,
                  resulting_source_state=post.source_state.value,
                  previous_assurance=state.assurance.value,
                  resulting_assurance=post.assurance.value,
                  forbidden_inferences=("profile-change based substantive promotion",),
                  rules_fired=("P-INV-01", "P-INV-02", "P-INV-03"),
                  next_governed_step=(
                      "complete the profile-change reassessment request"
                      if event.request_id is not None
                      else "issue a governed reassessment request if current support was removed"
                  ),
              )
              return post, trace
          '''
          text = replace_function(
              text,
              "def apply_profile_change",
              "def apply_request_reassessment",
              profile_function,
          )
          path.write_text(text)

          path = Path("src/csd_foundry/kernel/temporal_invariants.py")
          text = path.read_text()
          support_helpers = '''def _evidence_matches_required_profile(
              item: Evidence,
              required_profile_id: str | None,
              required_profile_version: int | None,
          ) -> bool:
              if required_profile_id is None or item.profile_id is None:
                  return True
              return (
                  item.profile_id == required_profile_id
                  and item.profile_version == required_profile_version
              )


          def _basis_is_supported(
              basis: Basis,
              evidence: dict[str, Evidence],
              required_profile_id: str | None,
              required_profile_version: int | None,
          ) -> bool:
              return (
                  bool(basis.member_evidence_ids)
                  and basis.approved
                  and all(
                      member in evidence
                      and evidence[member].status is EvidenceStatus.CURRENT
                      and _evidence_matches_required_profile(
                          evidence[member],
                          required_profile_id,
                          required_profile_version,
                      )
                      for member in basis.member_evidence_ids
                  )
              )


          def _expected_basis_survival(
              before: ControlState,
              after_evidence: dict[str, Evidence],
              required_profile_id: str | None,
              required_profile_version: int | None,
          ) -> tuple[frozenset[str], frozenset[str]]:
              bases = before.bases_by_id()
              source = frozenset(
                  basis_id
                  for basis_id in before.current_source_basis_ids
                  if (basis := bases.get(basis_id)) is not None
                  and _basis_is_supported(
                      basis,
                      after_evidence,
                      required_profile_id,
                      required_profile_version,
                  )
              )
              verdict = frozenset(
                  basis_id
                  for basis_id in before.current_verdict_basis_ids
                  if (basis := bases.get(basis_id)) is not None
                  and _basis_is_supported(
                      basis,
                      after_evidence,
                      required_profile_id,
                      required_profile_version,
                  )
              )
              return source, verdict
          '''
          text = replace_function(
              text,
              "def _basis_is_supported",
              "def _validate_profile_pair",
              support_helpers,
          )

          text = re.sub(
              r"        if item\.status is EvidenceStatus\.EXPIRED and \(\n"
              r"            item\.expires_at is None or item\.expires_at > state\.logical_time\n"
              r"        \):",
              "        if (\n"
              "            item.status is EvidenceStatus.EXPIRED\n"
              "            and item.expires_at is not None\n"
              "            and item.expires_at > state.logical_time\n"
              "        ):",
              text,
              count=1,
          )

          marker = "    requests = state.requests_by_id()\n"
          state_profile_check = '''    evidence_by_id = state.evidence_by_id()
              bases_by_id = state.bases_by_id()
              for basis_id in state.current_source_basis_ids | state.current_verdict_basis_ids:
                  basis = bases_by_id.get(basis_id)
                  if basis is not None and not _basis_is_supported(
                      basis,
                      evidence_by_id,
                      state.required_profile_id,
                      state.required_profile_version,
                  ):
                      violations.append(
                          Violation(
                              "P-INV-02",
                              f"current basis {basis_id} is incomplete under the required profile",
                          )
                      )

          '''
          if marker not in text:
              raise SystemExit("temporal state request marker not found")
          text = text.replace(marker, state_profile_check + marker, 1)

          text = re.sub(
              r"    expected_source_bases, expected_verdict_bases = _expected_basis_survival\(\n"
              r"        before, after_evidence\n"
              r"    \)",
              "    expected_source_bases, expected_verdict_bases = _expected_basis_survival(\n"
              "        before,\n"
              "        after_evidence,\n"
              "        after.required_profile_id,\n"
              "        after.required_profile_version,\n"
              "    )",
              text,
              count=1,
          )

          profile_validator = '''def _validate_profile_change(
              before: ControlState, event: ProfileChange, after: ControlState
          ) -> list[Violation]:
              violations: list[Violation] = []
              if after.logical_time != before.logical_time:
                  violations.append(Violation("P-INV-01", "profile change altered logical time"))
              if (
                  after.required_profile_id != event.profile_id
                  or after.required_profile_version != event.profile_version
              ):
                  violations.append(Violation("P-INV-01", "profile result does not match the event"))
              if after.evidence != before.evidence:
                  violations.append(
                      Violation("P-INV-02", "profile change rewrote historical evidence")
                  )
              if after.bases != before.bases:
                  violations.append(Violation("P-INV-02", "profile change rewrote historical bases"))

              after_evidence = after.evidence_by_id()
              expected_source_bases, expected_verdict_bases = _expected_basis_survival(
                  before,
                  after_evidence,
                  event.profile_id,
                  event.profile_version,
              )
              if after.current_source_basis_ids != expected_source_bases:
                  violations.append(
                      Violation("P-INV-02", "profile source-basis eligibility is not canonical")
                  )
              if after.current_verdict_basis_ids != expected_verdict_bases:
                  violations.append(
                      Violation("P-INV-02", "profile verdict-basis eligibility is not canonical")
                  )

              expected_source = before.source_state
              if expected_source is not SourceState.UNKNOWN and not expected_source_bases:
                  expected_source = SourceState.UNKNOWN
              expected_assurance = before.assurance
              if before.obligation is not ObligationStatus.CURRENT:
                  expected_assurance = Assurance.NA
              elif expected_assurance in _SUBSTANTIVE and not expected_verdict_bases:
                  expected_assurance = Assurance.STALE
              if after.source_state is not expected_source:
                  violations.append(Violation("P-INV-02", "profile source result is not canonical"))
              if after.assurance is not expected_assurance:
                  violations.append(Violation("P-INV-02", "profile assurance result is not canonical"))
              if after.obligation is not before.obligation:
                  violations.append(
                      Violation("P-INV-02", "profile change altered obligation state")
                  )

              new_request_ids = set(after.requests_by_id()) - set(before.requests_by_id())
              expected_request_ids = {event.request_id} if event.request_id is not None else set()
              if new_request_ids != expected_request_ids:
                  violations.append(
                      Violation("P-INV-03", "profile request identities do not match the event")
                  )
              if event.request_id is not None and event.request_due_at is not None:
                  expected_request = ReassessmentRequest(
                      request_id=event.request_id,
                      reason="required profile changed",
                      requested_at=before.logical_time,
                      due_at=event.request_due_at,
                  )
                  if after.requests_by_id().get(event.request_id) != expected_request:
                      violations.append(
                          Violation("P-INV-03", "profile reassessment request is not canonical")
                      )
              if after.heartbeat != before.heartbeat:
                  violations.append(Violation("H-INV-01", "profile change altered heartbeat state"))
              return violations
          '''
          text = replace_function(
              text,
              "def _validate_profile_change",
              "def _validate_request",
              profile_validator,
          )
          path.write_text(text)

          path = Path("src/csd_foundry/temporal/v0_3.py")
          text = path.read_text()
          scenario = '''def _t04_profile_change_is_scoped() -> TemporalScenarioResult:
              state = base_state(profile_id="PROFILE-A", profile_version=1)
              after = (
                  CsdOracle()
                  .apply(
                      state,
                      ProfileChange(
                          "PROFILE-A",
                          2,
                          request_id="REQ-PROFILE-A-2",
                          request_due_at=10,
                      ),
                  )
                  .after
              )
              evidence = after.evidence_by_id()
              request = after.requests_by_id()["REQ-PROFILE-A-2"]
              accepted = (
                  evidence["EV-SOURCE"].status is EvidenceStatus.CURRENT
                  and evidence["EV-VERDICT"].status is EvidenceStatus.CURRENT
                  and "BASIS-SOURCE" in after.bases_by_id()
                  and not after.current_source_basis_ids
                  and after.source_state is SourceState.UNKNOWN
                  and after.assurance is Assurance.PASS
                  and request.status is RequestStatus.PENDING
              )
              return _result(
                  "T-04",
                  accepted,
                  "profile change preserves evidence and removes incompatible current support",
              )
          '''
          text = replace_function(
              text,
              "def _t04_profile_change_is_scoped",
              "def _t05_request_preserves_verdict",
              scenario,
          )
          path.write_text(text)

          path = Path("src/csd_foundry/synthesis/temporal_mutations.py")
          text = path.read_text()
          marker = '''        TemporalMutationProbe(
                      "mut-request-promote-verdict",
          '''
          insertion = '''        TemporalMutationProbe(
                      "mut-profile-retain-incompatible-basis",
                      profile_before,
                      profile_event,
                      replace(
                          profile_after,
                          source_state=profile_before.source_state,
                          current_source_basis_ids=profile_before.current_source_basis_ids,
                      ),
                      frozenset({"P-INV-02"}),
                  ),
          '''
          if marker not in text:
              raise SystemExit("profile mutation insertion marker not found")
          text = text.replace(marker, insertion + marker, 1)
          path.write_text(text)

          path = Path("tests/test_temporal_kernel.py")
          text = path.read_text()
          text = text.replace(
              "from csd_foundry.kernel.models import Assurance, EvidenceStatus, RequestStatus",
              "from csd_foundry.kernel.models import (\n"
              "    Assurance,\n"
              "    EvidenceStatus,\n"
              "    RequestStatus,\n"
              "    SourceState,\n"
              ")",
              1,
          )
          text = text.replace(
              "    assert report.total == 10\n    assert report.killed == 10",
              "    assert report.total == 11\n    assert report.killed == 11",
              1,
          )
          if "test_legacy_expired_evidence_without_timestamp_remains_valid" not in text:
              text += '''

          def test_legacy_expired_evidence_without_timestamp_remains_valid() -> None:
              oracle = CsdOracle()
              original = base_state()
              legacy = replace(
                  original,
                  evidence=tuple(
                      replace(item, status=EvidenceStatus.EXPIRED)
                      if item.evidence_id == "EV-SOURCE"
                      else item
                      for item in original.evidence
                  ),
                  source_state=SourceState.UNKNOWN,
                  current_source_basis_ids=frozenset(),
              )

              after = oracle.apply(
                  legacy,
                  RequestReassessment("REQ-LEGACY", "legacy expiry control", due_at=5),
              ).after

              assert after.evidence_by_id()["EV-SOURCE"].status is EvidenceStatus.EXPIRED
              assert after.requests_by_id()["REQ-LEGACY"].status is RequestStatus.PENDING
          '''
          path.write_text(text)
          PY
      - run: ruff format .
      - run: ruff check --fix .
      - name: Commit profile and legacy compatibility corrections
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Align profile strengthening with preserved evidence"
          git push origin HEAD:web/7-temporal-governance-kernel-v0.3
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src
      - run: pytest
      - run: python scripts/validate_csd_reasoning_seed.py --directory data/seed/v0.1
      - run: python -m compileall -q src scripts tests
      - run: csd-foundry scenarios validate --release v0.1
      - run: csd-foundry mutations evaluate --release v0.1
      - run: csd-foundry temporal validate --release v0.3
      - run: csd-foundry temporal mutations --release v0.3
      - run: csd-foundry demo > /tmp/csd-foundry-demo.json && test -s /tmp/csd-foundry-demo.json
      - run: pip wheel . --no-deps --wheel-dir /tmp/csd-wheelhouse
      - name: Validate installed wheel outside the repository
        run: |
          python -m venv /tmp/csd-installed
          /tmp/csd-installed/bin/pip install /tmp/csd-wheelhouse/csd_foundry-*.whl
          cd /tmp
          /tmp/csd-installed/bin/csd-foundry scenarios validate --release v0.1 > scenario-report.json
          /tmp/csd-installed/bin/csd-foundry temporal validate --release v0.3 > temporal-report.json
          /tmp/csd-installed/bin/csd-foundry temporal mutations --release v0.3 > mutation-report.json
          test -s scenario-report.json
          test -s temporal-report.json
          test -s mutation-report.json
