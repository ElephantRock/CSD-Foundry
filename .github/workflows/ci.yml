name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: web/7-temporal-governance-kernel-v0.3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Complete profile-aware clock verification
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/csd_foundry/kernel/temporal_invariants.py")
          text = path.read_text()
          old = "    expected_source_bases, expected_verdict_bases = _expected_basis_survival(before, after_evidence)"
          new = '''    expected_source_bases, expected_verdict_bases = _expected_basis_survival(
              before,
              after_evidence,
              after.required_profile_id,
              after.required_profile_version,
          )'''
          if old not in text:
              raise SystemExit("profile-aware clock call not found")
          path.write_text(text.replace(old, new, 1))
          PY
      - run: ruff format .
      - run: ruff check --fix .
      - name: Commit profile-aware clock correction
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Complete profile-aware temporal verification"
          git push origin HEAD:web/7-temporal-governance-kernel-v0.3
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src
      - run: pytest
      - run: python scripts/validate_csd_reasoning_seed.py --directory data/seed/v0.1
      - run: python -m compileall -q src scripts tests
      - run: csd-foundry scenarios validate --release v0.1
      - run: csd-foundry mutations evaluate --release v0.1
      - run: csd-foundry temporal validate --release v0.3
      - run: csd-foundry temporal mutations --release v0.3
      - run: csd-foundry demo > /tmp/csd-foundry-demo.json && test -s /tmp/csd-foundry-demo.json
      - run: pip wheel . --no-deps --wheel-dir /tmp/csd-wheelhouse
      - name: Validate installed wheel outside the repository
        run: |
          python -m venv /tmp/csd-installed
          /tmp/csd-installed/bin/pip install /tmp/csd-wheelhouse/csd_foundry-*.whl
          cd /tmp
          /tmp/csd-installed/bin/csd-foundry scenarios validate --release v0.1 > scenario-report.json
          /tmp/csd-installed/bin/csd-foundry temporal validate --release v0.3 > temporal-report.json
          /tmp/csd-installed/bin/csd-foundry temporal mutations --release v0.3 > mutation-report.json
          test -s scenario-report.json
          test -s temporal-report.json
          test -s mutation-report.json
