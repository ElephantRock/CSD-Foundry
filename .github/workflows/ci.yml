name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: web/7-temporal-governance-kernel-v0.3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Apply strict typing corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/csd_foundry/kernel/temporal_invariants.py")
          text = path.read_text()
          old = '''    for request_id, old in before_requests.items():
                  new = after_requests.get(request_id)
                  if new is None:
                      violations.append(Violation("R-INV-03", f"request {request_id} was deleted"))
                      continue
                  stable_fields = (
                      old.request_id == new.request_id
                      and old.reason == new.reason
                      and old.requested_at == new.requested_at
                      and old.due_at == new.due_at
                  )
                  valid_closure = old == new or (
                      old.status is RequestStatus.PENDING
                      and new.status is RequestStatus.CLOSED
                      and new.closed_at == after.logical_time
                      and stable_fields
                  )
                  if not valid_closure:
                      violations.append(Violation("R-INV-03", f"request {request_id} was rewritten"))
          '''
          new = '''    for request_id, old_request in before_requests.items():
                  new_request = after_requests.get(request_id)
                  if new_request is None:
                      violations.append(Violation("R-INV-03", f"request {request_id} was deleted"))
                      continue
                  stable_fields = (
                      old_request.request_id == new_request.request_id
                      and old_request.reason == new_request.reason
                      and old_request.requested_at == new_request.requested_at
                      and old_request.due_at == new_request.due_at
                  )
                  valid_closure = old_request == new_request or (
                      old_request.status is RequestStatus.PENDING
                      and new_request.status is RequestStatus.CLOSED
                      and new_request.closed_at == after.logical_time
                      and stable_fields
                  )
                  if not valid_closure:
                      violations.append(Violation("R-INV-03", f"request {request_id} was rewritten"))
          '''
          if old not in text:
              raise SystemExit("temporal request block not found")
          path.write_text(text.replace(old, new, 1))

          path = Path("src/csd_foundry/cli.py")
          text = path.read_text()
          text = text.replace(
              "from csd_foundry.temporal.v0_3 import validate_release\n\n"
              "        temporal_result = validate_release(args.release)",
              "from csd_foundry.temporal.v0_3 import validate_release as validate_temporal_release\n\n"
              "        temporal_result = validate_temporal_release(args.release)",
              1,
          )
          text = text.replace(
              "from csd_foundry.synthesis.temporal_mutations import evaluate_release\n\n"
              "        temporal_mutation_result = evaluate_release(args.release)",
              "from csd_foundry.synthesis.temporal_mutations import (\n"
              "            evaluate_release as evaluate_temporal_mutations,\n"
              "        )\n\n"
              "        temporal_mutation_result = evaluate_temporal_mutations(args.release)",
              1,
          )
          path.write_text(text)
          PY
      - run: ruff format .
      - run: ruff check --fix .
      - name: Commit typing corrections
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Resolve temporal strict typing boundaries"
          git push origin HEAD:web/7-temporal-governance-kernel-v0.3
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src
      - run: pytest
      - run: python scripts/validate_csd_reasoning_seed.py --directory data/seed/v0.1
      - run: python -m compileall -q src scripts tests
      - run: csd-foundry scenarios validate --release v0.1
      - run: csd-foundry mutations evaluate --release v0.1
      - run: csd-foundry temporal validate --release v0.3
      - run: csd-foundry temporal mutations --release v0.3
      - run: csd-foundry demo > /tmp/csd-foundry-demo.json && test -s /tmp/csd-foundry-demo.json
      - run: pip wheel . --no-deps --wheel-dir /tmp/csd-wheelhouse
      - name: Validate installed wheel outside the repository
        run: |
          python -m venv /tmp/csd-installed
          /tmp/csd-installed/bin/pip install /tmp/csd-wheelhouse/csd_foundry-*.whl
          cd /tmp
          /tmp/csd-installed/bin/csd-foundry scenarios validate --release v0.1 > scenario-report.json
          /tmp/csd-installed/bin/csd-foundry temporal validate --release v0.3 > temporal-report.json
          /tmp/csd-installed/bin/csd-foundry temporal mutations --release v0.3 > mutation-report.json
          test -s scenario-report.json
          test -s temporal-report.json
          test -s mutation-report.json
