name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: web/5-scenario-registry-v0.2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Apply exact source corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/csd_foundry/kernel/transitions.py")
          text = path.read_text()
          text = text.replace(
              "if (basis := bases_before.get(basis_id)) is not None\n"
              "        and _basis_matches_claim(basis, BasisKind.SOURCE, resulting_source.value)",
              "if (existing_source_basis := bases_before.get(basis_id)) is not None\n"
              "        and _basis_matches_claim(\n"
              "            existing_source_basis, BasisKind.SOURCE, resulting_source.value\n"
              "        )",
              1,
          )
          text = text.replace(
              "if (basis := bases_before.get(basis_id)) is not None\n"
              "        and _basis_matches_claim(basis, BasisKind.VERDICT, resulting_assurance.value)",
              "if (existing_verdict_basis := bases_before.get(basis_id)) is not None\n"
              "        and _basis_matches_claim(\n"
              "            existing_verdict_basis, BasisKind.VERDICT, resulting_assurance.value\n"
              "        )",
              1,
          )
          path.write_text(text)

          path = Path("src/csd_foundry/kernel/invariants.py")
          text = path.read_text()
          text = text.replace(
              "for evidence_id, expected in expected_new_evidence.items():\n"
              "        actual = after_evidence.get(evidence_id)\n"
              "        if actual is not None and actual != expected:\n"
              "            violations.append(\n"
              "                Violation(\n"
              "                    \"G-INV-06\",\n"
              "                    f\"reassessment evidence {evidence_id} differs from the event\",\n"
              "                )\n"
              "            )",
              "for evidence_id, expected_evidence in expected_new_evidence.items():\n"
              "        actual_evidence = after_evidence.get(evidence_id)\n"
              "        if actual_evidence is not None and actual_evidence != expected_evidence:\n"
              "            violations.append(\n"
              "                Violation(\n"
              "                    \"G-INV-06\",\n"
              "                    f\"reassessment evidence {evidence_id} differs from the event\",\n"
              "                )\n"
              "            )",
              1,
          )
          text = text.replace(
              "for basis_id, expected in expected_new_bases.items():\n"
              "        actual = after_bases.get(basis_id)\n"
              "        if actual is not None and actual != expected:\n"
              "            violations.append(\n"
              "                Violation(\"G-INV-11\", f\"reassessment basis {basis_id} differs from the event\")\n"
              "            )",
              "for basis_id, expected_basis in expected_new_bases.items():\n"
              "        actual_basis = after_bases.get(basis_id)\n"
              "        if actual_basis is not None and actual_basis != expected_basis:\n"
              "            violations.append(\n"
              "                Violation(\"G-INV-11\", f\"reassessment basis {basis_id} differs from the event\")\n"
              "            )",
              1,
          )
          path.write_text(text)
          PY
      - run: ruff format .
      - run: ruff check --fix . || true
      - name: Commit deterministic corrections
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Resolve strict typing boundaries"
          git push origin HEAD:web/5-scenario-registry-v0.2
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src
      - run: pytest
      - run: python scripts/validate_csd_reasoning_seed.py --directory data/seed/v0.1
      - run: python -m compileall -q src scripts tests
      - run: csd-foundry scenarios validate --release v0.1
      - run: csd-foundry mutations evaluate --release v0.1
      - run: csd-foundry demo > /tmp/csd-foundry-demo.json && test -s /tmp/csd-foundry-demo.json
