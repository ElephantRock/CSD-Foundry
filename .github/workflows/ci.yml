name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: web/7-temporal-governance-kernel-v0.3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Enforce authority and request closure semantics
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/csd_foundry/kernel/temporal_invariants.py")
          text = path.read_text()

          old = '''def _validate_profile_change(
              before: ControlState, event: ProfileChange, after: ControlState
          ) -> list[Violation]:
              violations: list[Violation] = []
              if after.logical_time != before.logical_time:
          '''
          new = '''def _validate_profile_change(
              before: ControlState, event: ProfileChange, after: ControlState
          ) -> list[Violation]:
              violations: list[Violation] = []
              if event.authority != "I3":
                  violations.append(Violation("P-INV-01", "profile change requires I3 authority"))
              if after.logical_time != before.logical_time:
          '''
          if old not in text:
              raise SystemExit("profile validator prelude not found")
          text = text.replace(old, new, 1)

          old = '''def _validate_request(
              before: ControlState, event: RequestReassessment, after: ControlState
          ) -> list[Violation]:
              violations = _unchanged_temporal_governance(before, after, allow_requests=True)
              if (
          '''
          new = '''def _validate_request(
              before: ControlState, event: RequestReassessment, after: ControlState
          ) -> list[Violation]:
              violations = _unchanged_temporal_governance(before, after, allow_requests=True)
              if event.authority != "I3":
                  violations.append(
                      Violation("R-INV-01", "reassessment request requires I3 authority")
                  )
              if (
          '''
          if old not in text:
              raise SystemExit("request validator prelude not found")
          text = text.replace(old, new, 1)

          old = '''def _validate_heartbeat(
              before: ControlState, event: RecordHeartbeat, after: ControlState
          ) -> list[Violation]:
              violations: list[Violation] = []
              if after.logical_time != before.logical_time:
          '''
          new = '''def _validate_heartbeat(
              before: ControlState, event: RecordHeartbeat, after: ControlState
          ) -> list[Violation]:
              violations: list[Violation] = []
              if event.authority != "I3":
                  violations.append(Violation("H-INV-01", "heartbeat requires I3 authority"))
              if after.logical_time != before.logical_time:
          '''
          if old not in text:
              raise SystemExit("heartbeat validator prelude not found")
          text = text.replace(old, new, 1)

          old = '''    before_requests = before.requests_by_id()
              after_requests = after.requests_by_id()
              if set(after_requests) != set(before_requests):
          '''
          new = '''    before_requests = before.requests_by_id()
              after_requests = after.requests_by_id()
              unknown_request_ids = requested - set(before_requests)
              if unknown_request_ids:
                  violations.append(
                      Violation(
                          "R-INV-03",
                          f"unknown request closure identities: {sorted(unknown_request_ids)}",
                      )
                  )
              nonpending_request_ids = {
                  request_id
                  for request_id in requested & set(before_requests)
                  if before_requests[request_id].status is not RequestStatus.PENDING
              }
              if nonpending_request_ids:
                  violations.append(
                      Violation(
                          "R-INV-03",
                          "request closures must target pending requests: "
                          f"{sorted(nonpending_request_ids)}",
                      )
                  )
              if set(after_requests) != set(before_requests):
          '''
          if old not in text:
              raise SystemExit("request closure map block not found")
          text = text.replace(old, new, 1)
          path.write_text(text)

          path = Path("src/csd_foundry/synthesis/temporal_mutations.py")
          text = path.read_text()
          old = '''    profile_event = ProfileChange("PROFILE-A", 2)
              profile_after = oracle.apply(profile_before, profile_event).after

              stale = replace(
          '''
          new = '''    profile_event = ProfileChange("PROFILE-A", 2)
              profile_after = oracle.apply(profile_before, profile_event).after
              unauthorized_profile_event = replace(profile_event, authority="I2")

              stale = replace(
          '''
          if old not in text:
              raise SystemExit("profile probe setup not found")
          text = text.replace(old, new, 1)

          old = '''    request_event = RequestReassessment("REQ-MUT", "mutation control", due_at=8)
              request_after = oracle.apply(stale, request_event).after

              heartbeat_event = RecordHeartbeat(at_time=0, interval=5)
              heartbeat_after = oracle.apply(stale, heartbeat_event).after
          '''
          new = '''    request_event = RequestReassessment("REQ-MUT", "mutation control", due_at=8)
              request_after = oracle.apply(stale, request_event).after
              unauthorized_request_event = replace(request_event, authority="I2")

              heartbeat_event = RecordHeartbeat(at_time=0, interval=5)
              heartbeat_after = oracle.apply(stale, heartbeat_event).after
              unauthorized_heartbeat_event = replace(heartbeat_event, authority="I2")
          '''
          if old not in text:
              raise SystemExit("request and heartbeat probe setup not found")
          text = text.replace(old, new, 1)

          old = '''    close_event = Reassess((), (), close_request_ids=("REQ-CLOSE",))
              close_after = oracle.apply(requested, close_event).after

              clock_request_event = AdvanceClock(1)
          '''
          new = '''    close_event = Reassess((), (), close_request_ids=("REQ-CLOSE",))
              close_after = oracle.apply(requested, close_event).after
              unknown_close_event = Reassess((), (), close_request_ids=("REQ-UNKNOWN",))
              already_closed_event = Reassess((), (), close_request_ids=("REQ-CLOSE",))

              clock_request_event = AdvanceClock(1)
          '''
          if old not in text:
              raise SystemExit("request closure probe setup not found")
          text = text.replace(old, new, 1)

          marker = '''        TemporalMutationProbe(
                      "mut-request-promote-verdict",
          '''
          insertion = '''        TemporalMutationProbe(
                      "mut-profile-unauthorized-authority",
                      profile_before,
                      unauthorized_profile_event,
                      profile_after,
                      frozenset({"P-INV-01"}),
                  ),
                  TemporalMutationProbe(
                      "mut-request-unauthorized-authority",
                      stale,
                      unauthorized_request_event,
                      request_after,
                      frozenset({"R-INV-01"}),
                  ),
                  TemporalMutationProbe(
                      "mut-heartbeat-unauthorized-authority",
                      stale,
                      unauthorized_heartbeat_event,
                      heartbeat_after,
                      frozenset({"H-INV-01"}),
                  ),
          '''
          if marker not in text:
              raise SystemExit("authority mutation insertion marker not found")
          text = text.replace(marker, insertion + marker, 1)

          marker = '''        TemporalMutationProbe(
                      "mut-request-rewrite-due-time",
          '''
          insertion = '''        TemporalMutationProbe(
                      "mut-reassessment-close-unknown-request",
                      requested,
                      unknown_close_event,
                      requested,
                      frozenset({"R-INV-03"}),
                  ),
                  TemporalMutationProbe(
                      "mut-reassessment-close-already-closed-request",
                      close_after,
                      already_closed_event,
                      close_after,
                      frozenset({"R-INV-03"}),
                  ),
          '''
          if marker not in text:
              raise SystemExit("closure mutation insertion marker not found")
          text = text.replace(marker, insertion + marker, 1)
          path.write_text(text)

          path = Path("tests/test_temporal_kernel.py")
          text = path.read_text()
          text = text.replace(
              "    assert report.total == 11\n    assert report.killed == 11",
              "    assert report.total == 16\n    assert report.killed == 16",
              1,
          )
          path.write_text(text)
          PY
      - run: ruff format .
      - run: ruff check --fix .
      - name: Commit verifier completeness corrections
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Verify temporal authority and closure targets"
          git push origin HEAD:web/7-temporal-governance-kernel-v0.3
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src
      - run: pytest
      - run: python scripts/validate_csd_reasoning_seed.py --directory data/seed/v0.1
      - run: python -m compileall -q src scripts tests
      - run: csd-foundry scenarios validate --release v0.1
      - run: csd-foundry mutations evaluate --release v0.1
      - run: csd-foundry temporal validate --release v0.3
      - run: csd-foundry temporal mutations --release v0.3
      - run: csd-foundry demo > /tmp/csd-foundry-demo.json && test -s /tmp/csd-foundry-demo.json
      - run: pip wheel . --no-deps --wheel-dir /tmp/csd-wheelhouse
      - name: Validate installed wheel outside the repository
        run: |
          python -m venv /tmp/csd-installed
          /tmp/csd-installed/bin/pip install /tmp/csd-wheelhouse/csd_foundry-*.whl
          cd /tmp
          /tmp/csd-installed/bin/csd-foundry scenarios validate --release v0.1 > scenario-report.json
          /tmp/csd-installed/bin/csd-foundry temporal validate --release v0.3 > temporal-report.json
          /tmp/csd-installed/bin/csd-foundry temporal mutations --release v0.3 > mutation-report.json
          test -s scenario-report.json
          test -s temporal-report.json
          test -s mutation-report.json
