name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: web/10-synthesis-contracts-v0.4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Apply contract corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/csd_foundry/synthesis/v0_4/contracts.py")
          text = path.read_text()
          text = text.replace(
              '        _require_unique(self.event_pattern, "event_pattern")\n',
              '        for event_type in self.event_pattern:\n'
              '            _require_text(event_type, "event_pattern")\n',
              1,
          )
          text = text.replace(
              '        _require_unique(self.event_skeleton, "event_skeleton")\n',
              '        for event_type in self.event_skeleton:\n'
              '            _require_text(event_type, "event_skeleton")\n',
              1,
          )
          path.write_text(text)

          path = Path("src/csd_foundry/synthesis/v0_4/specs.py")
          text = path.read_text()
          text = text.replace(
              '                "justification": "The profile and request joint is preserved in a bounded projection.",\n',
              '                "justification": (\n'
              '                    "The profile and request joint is preserved in a bounded "\n'
              '                    "projection."\n'
              '                ),\n',
              1,
          )
          text = text.replace(
              '                "justification": "The rare temporal joint is preserved while incidental bases are omitted.",\n',
              '                "justification": (\n'
              '                    "The rare temporal joint is preserved while incidental bases "\n'
              '                    "are omitted."\n'
              '                ),\n',
              1,
          )
          text = text.replace(
              '                "justification": "A constructive witness family and metamorphic event-order check are required.",\n',
              '                "justification": (\n'
              '                    "A constructive witness family and metamorphic event-order "\n'
              '                    "check are required."\n'
              '                ),\n',
              1,
          )
          path.write_text(text)

          path = Path("src/csd_foundry/synthesis/v0_4/validation.py")
          text = path.read_text().replace(
              "            cause.owner\n",
              "            _ = cause.owner\n",
              1,
          )
          path.write_text(text)
          PY
      - run: ruff format .
      - run: ruff check --fix .
      - name: Commit deterministic formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Format and correct v0.4 synthesis contracts"
          git push origin HEAD:web/10-synthesis-contracts-v0.4
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src
      - run: pytest
      - run: python scripts/validate_csd_reasoning_seed.py --directory data/seed/v0.1
      - run: python -m compileall -q src scripts tests
      - run: csd-foundry scenarios validate --release v0.1
      - run: csd-foundry mutations evaluate --release v0.1
      - run: csd-foundry temporal validate --release v0.3
      - run: csd-foundry temporal mutations --release v0.3
      - run: csd-foundry synthesize contracts --release v0.4
      - run: csd-foundry demo > /tmp/csd-foundry-demo.json && test -s /tmp/csd-foundry-demo.json
      - run: pip wheel . --no-deps --wheel-dir /tmp/csd-wheelhouse
      - name: Validate installed wheel outside the repository
        run: |
          python -m venv /tmp/csd-installed
          /tmp/csd-installed/bin/pip install /tmp/csd-wheelhouse/csd_foundry-*.whl
          cd /tmp
          /tmp/csd-installed/bin/csd-foundry scenarios validate --release v0.1 > scenario-report.json
          /tmp/csd-installed/bin/csd-foundry temporal validate --release v0.3 > temporal-report.json
          /tmp/csd-installed/bin/csd-foundry temporal mutations --release v0.3 > mutation-report.json
          /tmp/csd-installed/bin/csd-foundry synthesize contracts --release v0.4 > contracts-report.json
          test -s scenario-report.json
          test -s temporal-report.json
          test -s mutation-report.json
          test -s contracts-report.json
