name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: web/7-temporal-governance-kernel-v0.3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Correct heartbeat event verification
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/csd_foundry/kernel/temporal_invariants.py")
          text = path.read_text()
          old = '''def _validate_heartbeat(
              before: ControlState, event: RecordHeartbeat, after: ControlState
          ) -> list[Violation]:
              violations = _unchanged_temporal_governance(before, after)
          '''
          new = '''def _validate_heartbeat(
              before: ControlState, event: RecordHeartbeat, after: ControlState
          ) -> list[Violation]:
              violations: list[Violation] = []
              if after.logical_time != before.logical_time:
                  violations.append(Violation("T-INV-01", "heartbeat altered logical time"))
              if (
                  after.required_profile_id != before.required_profile_id
                  or after.required_profile_version != before.required_profile_version
              ):
                  violations.append(Violation("P-INV-01", "heartbeat altered the required profile"))
              if after.reassessment_requests != before.reassessment_requests:
                  violations.append(Violation("R-INV-03", "heartbeat altered reassessment requests"))
          '''
          if old not in text:
              raise SystemExit("heartbeat verifier block not found")
          path.write_text(text.replace(old, new, 1))
          PY
      - run: ruff format .
      - run: ruff check --fix .
      - name: Commit heartbeat verifier correction
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Allow governed heartbeat state updates"
          git push origin HEAD:web/7-temporal-governance-kernel-v0.3
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src
      - name: Diagnose v0.1 scenario regressions
        run: |
          python - <<'PY'
          from csd_foundry.scenarios.registry import SCENARIOS
          from csd_foundry.scenarios.runner import validate_release

          report = validate_release(SCENARIOS, "v0.1")
          for scenario in report.scenarios:
              for case in scenario.cases:
                  if not case.accepted:
                      print(scenario.scenario_id, case.case_id, *case.details, sep=" | ")
          PY
      - run: pytest
      - run: python scripts/validate_csd_reasoning_seed.py --directory data/seed/v0.1
      - run: python -m compileall -q src scripts tests
      - run: csd-foundry scenarios validate --release v0.1
      - run: csd-foundry mutations evaluate --release v0.1
      - run: csd-foundry temporal validate --release v0.3
      - run: csd-foundry temporal mutations --release v0.3
      - run: csd-foundry demo > /tmp/csd-foundry-demo.json && test -s /tmp/csd-foundry-demo.json
      - run: pip wheel . --no-deps --wheel-dir /tmp/csd-wheelhouse
      - name: Validate installed wheel outside the repository
        run: |
          python -m venv /tmp/csd-installed
          /tmp/csd-installed/bin/pip install /tmp/csd-wheelhouse/csd_foundry-*.whl
          cd /tmp
          /tmp/csd-installed/bin/csd-foundry scenarios validate --release v0.1 > scenario-report.json
          /tmp/csd-installed/bin/csd-foundry temporal validate --release v0.3 > temporal-report.json
          /tmp/csd-installed/bin/csd-foundry temporal mutations --release v0.3 > mutation-report.json
          test -s scenario-report.json
          test -s temporal-report.json
          test -s mutation-report.json
