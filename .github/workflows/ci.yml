name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: web/5-scenario-registry-v0.2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: ruff format .
      - run: ruff check --fix .
      - name: Commit deterministic formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Apply deterministic formatting"
          git push origin HEAD:web/5-scenario-registry-v0.2
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src
      - run: pytest
      - run: python scripts/validate_csd_reasoning_seed.py --directory data/seed/v0.1
      - run: python -m compileall -q src scripts tests
      - run: csd-foundry scenarios validate --release v0.1
      - run: csd-foundry mutations evaluate --release v0.1
      - run: csd-foundry demo > /tmp/csd-foundry-demo.json && test -s /tmp/csd-foundry-demo.json
