name: One-shot hardening validation

on:
  push:
    branches:
      - web/3-harden-oracle-semantics
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-stamp:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Run complete validation gate
        shell: bash
        run: |
          set -euo pipefail
          ruff format --check .
          ruff check .
          mypy src
          pytest
          python scripts/validate_csd_reasoning_seed.py --directory data/seed/v0.1
          python -m compileall -q src scripts tests
          csd-foundry demo > /tmp/csd-foundry-demo.json
          test -s /tmp/csd-foundry-demo.json
      - name: Publish validation evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/validation
          cat > reports/validation/oracle-hardening.json <<EOF
          {
            "schema_version": "csd-foundry-validation/0.1",
            "status": "passed",
            "validated_commit": "${GITHUB_SHA}",
            "python": "3.11",
            "gates": [
              "ruff-format-check",
              "ruff-check",
              "mypy-src",
              "pytest",
              "seed-manifest-and-digest-validation",
              "compileall",
              "installed-cli-smoke"
            ]
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/validation/oracle-hardening.json
          git commit -m "test: record oracle hardening validation"
          git push origin HEAD:web/3-harden-oracle-semantics
