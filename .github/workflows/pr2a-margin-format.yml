name: PR2A margin format

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'web/14-canonical-values-identities-v0.4'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install ruff
      - name: Apply repository formatting
        run: |
          ruff format src/csd_foundry/synthesis/v0_4/identity_policy.py tests/synthesis_v0_4/test_identity_exact_types.py
          ruff check --fix src/csd_foundry/synthesis/v0_4/identity_policy.py tests/synthesis_v0_4/test_identity_exact_types.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/csd_foundry/synthesis/v0_4/identity_policy.py tests/synthesis_v0_4/test_identity_exact_types.py
          if ! git diff --cached --quiet; then
            git commit -m "Normalize safety-margined collision assurance"
            git push origin HEAD:${{ github.head_ref }}
          fi
