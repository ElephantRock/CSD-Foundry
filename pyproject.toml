[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "csd-foundry"
version = "0.1.0"
description = "Executable CSD reasoning kernel and governed synthetic-data foundry"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "ElephantRock"}]
dependencies = [
  "jsonschema>=4.23",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15",
  "pytest>=8.3",
  "ruff>=0.9",
  "transformers>=4.44",
  "types-jsonschema>=4.23",
]

[project.scripts]
csd-foundry = "csd_foundry.cli:main"
csd-foundry-admission = "csd_foundry.governance.v0_5.admission_cli:main"
csd-foundry-assumption-mutations-v0-5 = "csd_foundry.governance.v0_5.assumption_mutation_cli:main"
csd-foundry-assumption-v0-5 = "csd_foundry.governance.v0_5.assumption_cli:main"
csd-foundry-alternative-model-mutations-v0-5 = "csd_foundry.governance.v0_5.alternative_model_mutation_cli:main"
csd-foundry-alternative-model-v0-5 = "csd_foundry.governance.v0_5.alternative_model_validation_cli:main"
csd-foundry-evidence-v0-5 = "csd_foundry.governance.v0_5.evidence_cli:main"
csd-foundry-evidence-mutations-v0-5 = "csd_foundry.governance.v0_5.evidence_mutation_cli:main"
csd-foundry-governance = "csd_foundry.governance.v0_5.cli:main"
csd-foundry-phase3-qualification-v0-5 = "csd_foundry.governance.v0_5.phase3_qualification_cli:main"
csd-foundry-temporal-v0-5 = "csd_foundry.governance.v0_5.temporal_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/csd-foundry/specs/v0.5" = ["specs/v0.5/*.json"]
"share/csd-foundry/schemas/v0.5" = ["schemas/v0.5/*.json"]
"share/csd-foundry/data/canary/v0.5/contract-v1" = ["data/canary/v0.5/contract-v1/*.json"]
"share/csd-foundry/data/canary/v0.5/admission-v1" = ["data/canary/v0.5/admission-v1/*.json"]
"share/csd-foundry/data/canary/v0.5/temporal-v1" = ["data/canary/v0.5/temporal-v1/*.json"]
"share/csd-foundry/data/canary/v0.5/evidence-v1" = ["data/canary/v0.5/evidence-v1/*.json"]
"share/csd-foundry/data/canary/v0.5/evidence-mutations-v1" = ["data/canary/v0.5/evidence-mutations-v1/*.json"]
"share/csd-foundry/data/canary/v0.5/assumption-v1" = ["data/canary/v0.5/assumption-v1/*.json"]
"share/csd-foundry/data/canary/v0.5/assumption-mutations-v1" = ["data/canary/v0.5/assumption-mutations-v1/*.json"]
"share/csd-foundry/data/canary/v0.5/alternative-model-v1" = ["data/canary/v0.5/alternative-model-v1/*.json"]
"share/csd-foundry/data/canary/v0.5/alternative-model-mutations-v1" = ["data/canary/v0.5/alternative-model-mutations-v1/*.json"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["csd_foundry"]

[[tool.mypy.overrides]]
module = "csd_foundry.empirical.e0h.windows_native"
disable_error_code = ["attr-defined", "import-not-found"]

[tool.ruff.lint.per-file-ignores]
"experiments/e0h/windows_native_v1/compile_release.py" = ["UP035"]
"experiments/e0h/windows_native_v1/native_controller.py" = ["UP035"]
"scripts/generate_csd_reasoning_seed.py" = ["E501"]
"src/csd_foundry/empirical/e0h/windows_native.py" = ["UP035"]
"src/csd_foundry/kernel/temporal_invariants.py" = ["E501"]
